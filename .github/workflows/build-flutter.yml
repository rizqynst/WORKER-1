name: Build APK Biasa (Flutter / Web2APK) - KHUSUS APK BIASA

run-name: Build ${{ github.event.inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true
      build_type:
        description: 'release / debug'
        required: false
        default: 'release'

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_PLATFORMS: android-arm,android-arm64

    steps:
      - name: Free disk space (background)
        run: |
          # Dulu langkah ini memblokir 1-2 menit. Sekarang rm jalan di background, dan build baru menunggu
          # penanda selesai tepat sebelum Gradle jalan. JANGAN hapus /usr/local/lib/android (SDK dipakai build).
          df -h / | tail -n 1
          rm -f /tmp/free_disk_done
          nohup bash -c '
            sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
                        /usr/local/share/boost /opt/ghc /usr/local/.ghcup /usr/share/swift \
                        /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/az /usr/lib/google-cloud-sdk \
                        /usr/lib/mono /usr/local/julia* 2>/dev/null
            sudo apt-get clean >/dev/null 2>&1
            docker system prune -af >/dev/null 2>&1
            touch /tmp/free_disk_done
          ' >/dev/null 2>&1 &
          disown || true

      - name: Parse payload
        run: |
          set -euo pipefail
          echo '${{ github.event.inputs.payload }}' > payload.json
          cat payload.json

          # [bot-workflow] rev=2026-11-09.1 (resep build: build sukses menulis recipe.json (versi Flutter yang dipakai) dan mengunggahnya sebagai artifact recipe-jobId untuk dicatat bot; sebelumnya 2026-11-07.4: pub get: kandidat terakhir mengganti package git yang konflik ke versi pub.dev; sebelumnya 2026-11-07.3: pub get: langkah C dependency_overrides 3 kandidat (git/host/any) dipilih lewat tes compile cepat, untuk konflik package git seperti better_player; sebelumnya 2026-11-07.2: dependency_overrides any; sebelumnya 2026-11-07.1: jenis jalur wajib eksplisit, tidak ada tebakan; sebelumnya 2026-11-04.4: build cepat: Flutter 1 keputusan tanpa uji satu-satu, build ZIP pakai jalur cepat 2 ABI + Gradle paralel; sebelumnya 2026-11-04.3: KHUSUS APK BIASA: cabang Gradle native/Genetic dihapus total dari workflow ini, Genetic hanya di build-android.yml; alur dispatch/payload/unduh ZIP/artifact apk-jobId mengikuti AMBIL_ALURGH; sebelumnya 2026-11-04.2 jalur dipisah via payload.projectType; 2026-11-04.1 alur Flutter mode ZIP disamakan dengan worker VPS; 2026-11-01.2 samain alur AMBIL_ALURGH: payload url+tag, cek ZIP kosong, run-name=jobId; 2026-10-27.2 tambah Free disk space)
          # Tipe build: payload.buildType dulu (dikirim bot), cadangan input build_type, default release
          BUILD_TYPE=$(jq -r '.buildType // empty' payload.json)
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE=release
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

          # Workflow ini KHUSUS APK BIASA (Flutter). Jalur GENETIC (Android native) punya workflow sendiri
          # (build-android.yml) dan tidak pernah lewat sini.
          REQ_TYPE=$(jq -r '.projectType // empty' payload.json)
          if [ -n "$REQ_TYPE" ] && [ "$REQ_TYPE" != "flutter" ]; then
            echo "::error::Workflow ini KHUSUS APK BIASA (Flutter). Mode yang dipilih ($REQ_TYPE) harus memakai workflow build-android.yml (KHUSUS GENETIC)."
            exit 1
          fi
          if [ -z "$REQ_TYPE" ] && [ "$(jq -r '.mode // empty' payload.json)" = "zip" ]; then
            echo "::error::Payload ZIP tidak membawa jenis build. Pilih KHUSUS APK BIASA atau KHUSUS GENETIC di bot lalu build ulang."
            exit 1
          fi
          echo "Mode: KHUSUS APK BIASA (Flutter)"

          MODE=$(jq -r '.mode // empty' payload.json)
          if [ -z "$MODE" ]; then
            if jq -e '.appName' payload.json >/dev/null 2>&1; then MODE="url"; else MODE="zip"; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

          if [ "$MODE" = "url" ]; then
            WEB_URL=$(jq -r '.url // empty' payload.json)
            APP_NAME=$(jq -r '.appName // "WebApp"' payload.json)
            ICON_URL=$(jq -r '.iconUrl // empty' payload.json)
            if [ -z "$WEB_URL" ]; then
              echo "::error::mode=url tapi gak ada 'url' website di payload"
              exit 1
            fi
            echo "WEB_URL=$WEB_URL" >> "$GITHUB_ENV"
            echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
            echo "ICON_URL=$ICON_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: Web2APK -> $WEB_URL ($APP_NAME)"
          else
            ZIP_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
            if [ -z "$ZIP_URL" ]; then
              echo "::error::Tidak ada zipAssetUrl / url di payload"
              exit 1
            fi
            echo "ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: ZIP project -> $ZIP_URL"
          fi

      - name: Download & extract ZIP
        if: env.MODE == 'zip'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u; set +e
          rm -rf project_raw project.zip
          mkdir -p project_raw

          TAG=$(jq -r '.tag // empty' payload.json)
          PUBLIC_URL=$(jq -r '.url // empty' payload.json)

          OK=0
          # 1) Link publik dari payload.url (jalur sama seperti AMBIL_ALURGH)
          if [ -n "$PUBLIC_URL" ]; then
            echo "Unduh via link publik..."
            if curl -fL --retry 3 --retry-delay 5 -o project.zip "$PUBLIC_URL" && [ -s project.zip ]; then OK=1; fi
          fi
          # 2) Cadangan: cari asset lewat tag release + token (repo private)
          if [ "$OK" != "1" ] && [ -n "$TAG" ]; then
            echo "Cari asset lewat tag $TAG ..."
            ASSET_ID=$(curl -fsSL --retry 3 --retry-delay 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
              | jq -r '.assets[0].id // empty' || true)
            if [ -n "$ASSET_ID" ]; then
              if curl -fL --retry 3 --retry-delay 5 \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/octet-stream" \
                   -o project.zip "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" \
                 && [ -s project.zip ]; then OK=1; fi
            fi
          fi
          if [ "$OK" != "1" ]; then
            echo "::error::Gagal mengunduh ZIP project (url=$PUBLIC_URL, tag=$TAG)"
            exit 22
          fi

          ls -lh project.zip
          # Ekstrak: unzip dulu, kalau gagal / hasil kosong coba 7z. Jangan lanjut kalau kosong.
          unzip -o -q project.zip -d project_raw || true
          if [ -z "$(find project_raw -type f | head -n 1)" ]; then
            echo "unzip tidak menghasilkan file, coba 7z..."
            (command -v 7z >/dev/null 2>&1 || sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1) || true
            7z x -y -oproject_raw project.zip >/dev/null 2>&1 || true
          fi
          if [ -z "$(find project_raw -type f | head -n 1)" ]; then
            echo "::error::ZIP kosong / gagal diekstrak (ukuran: $(stat -c%s project.zip) byte)"
            unzip -l project.zip 2>&1 | head -20 || true
            exit 1
          fi

          # ZIP di dalam ZIP: sama seperti worker VPS, SEMUA zip di dalam dibuka dulu (maksimal 3 putaran)
          # sebelum project dideteksi, supaya project Flutter yang ada di ZIP dalam terbaca.
          for ROUND in 1 2 3; do
            NESTED=$(find project_raw -type f -iname '*.zip')
            if [ -z "$NESTED" ]; then break; fi
            FOUND=0
            echo "Buka ZIP di dalam ZIP (putaran $ROUND dari 3) ..."
            while IFS= read -r Z; do
              [ -n "$Z" ] || continue
              D="${Z%.*}"
              mkdir -p "$D"
              if unzip -o -q "$Z" -d "$D" || 7z x -y -o"$D" "$Z" >/dev/null 2>&1; then rm -f "$Z"; FOUND=1; else rm -rf "$D"; fi
            done <<< "$NESTED"
            [ "$FOUND" -eq 1 ] || break
          done

          echo "=== Struktur root project_raw ==="
          find project_raw -maxdepth 3 -type d | head -50
          echo ""
          echo "=== File kunci ==="
          find project_raw -maxdepth 6 -type f -name "pubspec.yaml" \
            -not -path "*/build/*" | head -30

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: env.MODE == 'url'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: false

      - name: Detect / Generate project
        id: detect
        run: |
          set -euo pipefail

          if [ "$MODE" = "url" ]; then
            SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_]+/_/g' | sed -E 's/^[0-9]+/a&/')
            [ -z "$SAFE_NAME" ] && SAFE_NAME="webapp"
            export APP_NAME WEB_URL
            DART_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; s=s.replace(chr(92),chr(92)*2).replace(chr(39),chr(92)+chr(39)); sys.stdout.write(s)")
            XML_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; sys.stdout.write(''.join(c for c in s if c not in '&<>'+chr(34)))")
            WEB_URL_SAFE=$(python3 -c "import os,sys; sys.stdout.write(os.environ['WEB_URL'].replace(chr(39),'%27'))")

            mkdir -p project_raw
            cd project_raw
            echo "🛠️  flutter create $SAFE_NAME ..."
            flutter create --org com.ziperr --project-name "$SAFE_NAME" --platforms=android --no-pub "$SAFE_NAME" >/dev/null
            cd "$SAFE_NAME"

            echo "📦 Nambah webview_flutter ..."
            flutter pub add webview_flutter

            HAS_ICON=false
            if [ -n "$ICON_URL" ]; then
              mkdir -p assets
              if curl -fsSL --max-time 20 "$ICON_URL" -o assets/icon.png && [ -s assets/icon.png ]; then
                HAS_ICON=true
                echo "🎨 Icon custom terdeteksi, nambah flutter_launcher_icons ..."
                flutter pub add dev:flutter_launcher_icons
                printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n' > flutter_launcher_icons.yaml
              else
                echo "::warning::Gagal download icon dari $ICON_URL, pakai icon default Flutter."
              fi
            fi

            if [ "$HAS_ICON" = "true" ]; then
              echo "🎨 Generate launcher icon ..."
              dart run flutter_launcher_icons || echo "::warning::flutter_launcher_icons gagal, lanjut pakai icon default."
            fi

            export DART_APP_NAME WEB_URL_SAFE
            echo '' | base64 -d > lib/main.dart
            python3 -c "import os; p='lib/main.dart'; c=open(p).read(); c=c.replace('__DART_APP_NAME__', os.environ['DART_APP_NAME']).replace('__WEB_URL_SAFE__', os.environ['WEB_URL_SAFE']); open(p,'w').write(c)"

            sed -i "s/android:label=\"[^\"]*\"/android:label=\"${XML_APP_NAME}\"/" android/app/src/main/AndroidManifest.xml

            python3 -c "p='android/app/src/main/AndroidManifest.xml'; c=open(p).read(); c=c if 'android.permission.INTERNET' in c else c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application', 1); c=c if 'usesCleartextTraffic' in c else c.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1); open(p,'w').write(c)"

            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=project_raw/$SAFE_NAME" >> "$GITHUB_OUTPUT"
            echo "✅ Web2APK project di-generate -> project_raw/$SAFE_NAME"

          else
            # Pilih pubspec.yaml terbaik, bukan sekadar yang pertama ketemu: project ZIP sering
            # berisi pubspec lain (package/plugin/example) yang tidak punya lib/main.dart.
            # Skor: punya lib/main.dart (+400), punya folder android (+200), sdk flutter (+100),
            # makin dangkal makin baik.
            PUBSPEC=""
            BEST=-100000
            while IFS= read -r f; do
              d=$(dirname "$f")
              score=0
              [ -f "$d/lib/main.dart" ] && score=$((score+400))
              [ -d "$d/android" ] && score=$((score+200))
              grep -q 'sdk: flutter' "$f" 2>/dev/null && score=$((score+100))
              depth=$(printf '%s' "$d" | tr -cd '/' | wc -c)
              score=$((score-depth))
              echo "kandidat pubspec: $f (skor $score)"
              if [ "$score" -gt "$BEST" ]; then BEST=$score; PUBSPEC="$f"; fi
            done < <(find project_raw -type f -name pubspec.yaml \
                      -not -path "*/build/*" -not -path "*/.dart_tool/*" \
                      -not -path "*/.symlinks/*" -not -path "*/ephemeral/*")

            echo "pubspec : ${PUBSPEC:-<none>}"

            if [ -z "$PUBSPEC" ]; then
              echo "::error::Mode KHUSUS APK BIASA (Flutter), tetapi ZIP tidak punya pubspec.yaml. Kalau ini project Android Java/Kotlin, pilih KHUSUS GENETIC lalu build ulang."
              echo "=== Isi ZIP (kedalaman 3) ==="
              find project_raw -maxdepth 3 | head -50
              exit 1
            fi

            DIR=$(dirname "$PUBSPEC")
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Flutter project → $DIR"
          fi

      - name: Pilih versi Flutter (1 keputusan, tanpa uji satu-satu)
        id: fv
        if: env.MODE != 'url'
        env:
          PROJ_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const FALLBACK = '3.38.0';
          const FALLBACK_DART = '3.10.0'; // Dart bawaan Flutter 3.38.0, dipakai supaya kasus umum tidak perlu unduh katalog rilis
          const out = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\n');
          const dir = process.env.PROJ_DIR || '.';
          let text = '';
          try { text = fs.readFileSync(dir + '/pubspec.yaml', 'utf8'); } catch (_) { out(FALLBACK); process.exit(0); }

          // Sama seperti VPS (projectPrep.js selectCompatibleFlutter): baca blok environment pubspec.yaml
          function yamlConstraint(key) {
            const m = text.match(/(?:^|\n)environment\s*:\s*\n([\s\S]*?)(?=\n[^ \t]|$)/i);
            if (!m) return '';
            for (const line of m[1].split(/\r?\n/)) {
              const x = line.match(/^\s*([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*?)\s*$/);
              if (x && x[1].toLowerCase() === key.toLowerCase()) return x[2].replace(/^['"]|['"]$/g, '').trim();
            }
            return '';
          }
          // Versi Flutter yang dikunci di dalam ZIP (urutan prioritas). Hanya versi persis x.y.z yang dipakai.
          function readPinned() {
            const rd = (f) => { try { return fs.readFileSync(dir + '/' + f, 'utf8'); } catch (_) { return ''; } };
            const exact = (v) => { const m = String(v || '').trim().match(/^v?(\d+\.\d+\.\d+)(?:[-+].*)?$/); return m ? m[1] : ''; };
            let v = '';
            try { v = exact((JSON.parse(rd('.fvmrc')) || {}).flutter); if (v) return { v, src: '.fvmrc' }; } catch (_) {}
            try { const j = JSON.parse(rd('.fvm/fvm_config.json')) || {}; v = exact(j.flutterSdkVersion || j.flutter); if (v) return { v, src: '.fvm/fvm_config.json' }; } catch (_) {}
            const tv = rd('.tool-versions').match(/^\s*flutter\s+(\S+)/im); if (tv) { v = exact(tv[1]); if (v) return { v, src: '.tool-versions' }; }
            v = exact(yamlConstraint('flutter')); if (v) return { v, src: 'pubspec environment.flutter' };
            return null;
          }
          const pinned = readPinned();
          const dartRange = yamlConstraint('sdk');
          const flutterRange = yamlConstraint('flutter');
          function ver(s) { const m = String(s || '').match(/(?:v)?(\d+)\.(\d+)(?:\.(\d+))?/); return m ? [Number(m[1]), Number(m[2]), Number(m[3] || 0)] : null; }
          function cmp(a, b) { for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] - b[i]; } return 0; }
          function bumpCaret(lo) { if (lo[0] > 0) return [lo[0] + 1, 0, 0]; if (lo[1] > 0) return [0, lo[1] + 1, 0]; return [0, 0, lo[2] + 1]; }
          function satisfies(version, expr) {
            if (!expr || expr === 'any') return true;
            const x = ver(version); if (!x) return false;
            return String(expr).split(/\s*\|\|\s*/).some((part) => part.trim().split(/\s+/).filter(Boolean).every((tok) => {
              if (tok === 'any') return true;
              if (tok.startsWith('^')) { const lo = ver(tok.slice(1)); if (!lo) return false; return cmp(x, lo) >= 0 && cmp(x, bumpCaret(lo)) < 0; }
              if (tok.startsWith('~')) { const lo = ver(tok.slice(1)); if (!lo) return false; return cmp(x, lo) >= 0 && cmp(x, [lo[0], lo[1] + 1, 0]) < 0; }
              const op = (tok.match(/^(>=|<=|>|<|=)/) || [])[1] || '=';
              const m = tok.replace(/^(>=|<=|>|<|=)/, '').match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?/);
              if (!m) return true;
              const c = cmp(x, [Number(m[1]), Number(m[2] || 0), Number(m[3] || 0)]);
              if (op === '>=') return c >= 0; if (op === '>') return c > 0; if (op === '<=') return c <= 0; if (op === '<') return c < 0;
              return c === 0;
            }));
          }
          function get(url) {
            return new Promise((resolve, reject) => https.get(url, (res) => {
              let d = ''; res.on('data', (c) => d += c);
              res.on('end', () => res.statusCode >= 200 && res.statusCode < 300 ? resolve(d) : reject(new Error('HTTP ' + res.statusCode)));
            }).on('error', reject));
          }
          (async () => {
            console.log('pubspec environment: sdk="' + dartRange + '" flutter="' + flutterRange + '"');
            // 1) Versi dikunci di ZIP dan ada di katalog stable -> pakai persis itu.
            if (pinned) {
              console.log('Versi di ZIP: ' + pinned.v + ' (dari ' + pinned.src + ')');
              if (pinned.v === FALLBACK) { out(FALLBACK); return; }
              try {
                const raw0 = process.env.FLUTTER_RELEASES_FILE ? fs.readFileSync(process.env.FLUTTER_RELEASES_FILE, 'utf8') : await get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json');
                const hit = (JSON.parse(raw0).releases || []).find((r) => r.channel === 'stable' && r.archive && r.version === pinned.v);
                if (hit) { console.log('Flutter ' + hit.version + ' dipakai sesuai ZIP (dart ' + hit.dart_sdk_version + ')'); out(hit.version); return; }
                console.log('::warning::Versi ' + pinned.v + ' dari ZIP tidak ada di rilis stable, pakai pemilihan biasa');
              } catch (e) { console.log('::warning::Gagal cek katalog untuk versi ZIP (' + e.message + '), pakai pemilihan biasa'); }
            }
            // 1b) Tidak ada versi persis di ZIP -> tebak dari .metadata (revision Flutter saat project dibuat/dimigrasi),
            //     dicocokkan ke hash rilis di katalog resmi. Versi default (FALLBACK) disimpan sebagai cadangan "alt":
            //     dipakai sekali kalau kode Dart gagal dikompilasi dengan versi tebakan.
            const outAlt = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'alt=' + v + '\n');
            function metaRevision() {
              let t = ''; try { t = fs.readFileSync(dir + '/.metadata', 'utf8'); } catch (_) { return ''; }
              const m = t.match(/(?:^|\n)version:[ \t]*\r?\n((?:[ \t]+.*\r?\n?)*)/);
              if (!m) return '';
              const r = m[1].match(/^[ \t]+revision:[ \t]*["']?([0-9a-fA-F]{7,40})["']?/m);
              return r ? r[1].toLowerCase() : '';
            }
            const mrev = pinned ? '' : metaRevision();
            if (mrev) {
              try {
                const rawM = process.env.FLUTTER_RELEASES_FILE ? fs.readFileSync(process.env.FLUTTER_RELEASES_FILE, 'utf8') : await get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json');
                const hitM = (JSON.parse(rawM).releases || []).find((r) => r.channel === 'stable' && r.archive && r.hash && String(r.hash).toLowerCase().startsWith(mrev));
                const okM = hitM && (!dartRange || !hitM.dart_sdk_version || satisfies(hitM.dart_sdk_version, dartRange)) && (!flutterRange || satisfies(hitM.version, flutterRange));
                if (okM && hitM.version !== FALLBACK) {
                  console.log('Versi ditebak dari .metadata: Flutter ' + hitM.version + ' (dart ' + hitM.dart_sdk_version + '), cadangan: ' + FALLBACK);
                  outAlt(FALLBACK); out(hitM.version); return;
                }
                console.log('.metadata revision ' + mrev + ': ' + (hitM ? 'tidak cocok dengan batas pubspec / sama dengan default' : 'tidak ada di katalog stable') + ', pakai pemilihan biasa');
              } catch (e) { console.log('::warning::Gagal membaca katalog untuk .metadata (' + e.message + '), pakai pemilihan biasa'); }
            }
            // 1c) .metadata tidak ada / tidak cocok -> tebak dari ZAMAN project: tanggal ubah pubspec.lock (atau pubspec.yaml) di ZIP.
            //     Dipilih Flutter stable terbaru yang dirilis SEBELUM tanggal itu dan cocok dengan batas pubspec. Hanya dipakai kalau
            //     project terakhir diubah sebelum rilis versi default (project lama); kalau tidak, versi default sudah cukup baru.
            function projectDate() {
              for (const f of ['pubspec.lock', 'pubspec.yaml']) {
                try { const t = fs.statSync(dir + '/' + f).mtime; if (t && t.getFullYear() >= 2019) return t; } catch (_) {}
              }
              return null;
            }
            const pdate = pinned ? null : projectDate();
            if (pdate) {
              try {
                const rawD = process.env.FLUTTER_RELEASES_FILE ? fs.readFileSync(process.env.FLUTTER_RELEASES_FILE, 'utf8') : await get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json');
                const relsD = (JSON.parse(rawD).releases || []).filter((r) => r.channel === 'stable' && r.archive && r.version && r.release_date);
                const defD = relsD.find((r) => r.version === FALLBACK);
                const defDate = defD ? new Date(defD.release_date) : new Date('2025-11-12');
                if (pdate < defDate) {
                  const era = relsD
                    .filter((r) => new Date(r.release_date) <= pdate && (!dartRange || !r.dart_sdk_version || satisfies(r.dart_sdk_version, dartRange)) && (!flutterRange || satisfies(r.version, flutterRange)))
                    .sort((a, b) => new Date(b.release_date) - new Date(a.release_date))[0];
                  if (era && era.version !== FALLBACK) {
                    console.log('Project terakhir diubah ' + pdate.toISOString().slice(0, 10) + ' -> Flutter zaman itu: ' + era.version + ' (dart ' + era.dart_sdk_version + '), cadangan: ' + FALLBACK);
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, 'alt=' + FALLBACK + '\n'); out(era.version); return;
                  }
                }
              } catch (e) { console.log('::warning::Gagal menebak versi dari tanggal project (' + e.message + '), pakai pemilihan biasa'); }
            }
            // 2) Tidak ada versi di ZIP / tidak ditemukan -> alur biasa di bawah.
            // Jalur cepat: versi default cocok -> selesai, tanpa fetch katalog dan tanpa menimbang versi lain.
            if (satisfies(FALLBACK_DART, dartRange) && satisfies(FALLBACK, flutterRange)) { console.log('Flutter default ' + FALLBACK + ' cocok (jalur cepat)'); out(FALLBACK); return; }
            const raw = process.env.FLUTTER_RELEASES_FILE
              ? fs.readFileSync(process.env.FLUTTER_RELEASES_FILE, 'utf8')
              : await get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json');
            // Ikuti ZIP: tanpa lantai versi. Kalau 3.38.0 tidak cocok dengan batas pubspec (mis. sdk "<3.0.0"),
            // pakai Flutter stable terbaru yang cocok dengan batas itu, termasuk yang lebih lama dari 3.38.0.
            // Kalau ternyata sebuah dependency butuh Dart lebih baru, langkah pub get di bawah menaikkan Flutter otomatis.
            const stable = (JSON.parse(raw).releases || []).filter((r) => r.channel === 'stable' && r.archive && r.version);
            stable.sort((a, b) => String(b.release_date || '').localeCompare(String(a.release_date || '')));
            const fits = (r) => (!dartRange || !r.dart_sdk_version || satisfies(r.dart_sdk_version, dartRange)) && (!flutterRange || satisfies(r.version, flutterRange));
            // Urutan sama dengan VPS: versi default dipakai kalau cocok, kalau tidak yang stable terbaru yang cocok.
            const def = stable.find((r) => r.version === FALLBACK);
            if (def && fits(def)) { console.log('Flutter default ' + FALLBACK + ' cocok'); out(FALLBACK); return; }
            const pick = stable.find(fits);
            if (pick) { console.log('Flutter dipilih: ' + pick.version + ' (dart ' + pick.dart_sdk_version + ')'); out(pick.version); return; }
            console.log('::warning::Tidak ada Flutter stable yang cocok dengan batas pubspec (sdk="' + dartRange + '"), pakai ' + FALLBACK + ' (batas atas SDK diabaikan)');
            out(FALLBACK);
          })().catch((e) => { console.log('::warning::Gagal memilih versi Flutter (' + e.message + '), pakai ' + FALLBACK); out(FALLBACK); });
          NODE

      - name: Setup Flutter (versi sesuai project)
        if: env.MODE != 'url'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: stable
          cache: false

      - name: Sanitize Android PNG resources
        run: |
          set +e
          DIR="${{ steps.detect.outputs.dir }}"
          if command -v magick >/dev/null 2>&1; then IM="magick"; elif command -v convert >/dev/null 2>&1; then IM="convert"; else IM=""; fi
          if [ -z "$IM" ]; then echo "ImageMagick tidak ada, lewati sanitasi PNG"; exit 0; fi
          FIXED=0; BAD=0
          while IFS= read -r f; do
            case "$f" in *.9.png) continue;; esac
            # Re-encode ke PNG 8-bit RGBA non-interlaced (isi file dibaca dari konten, bukan ekstensi)
            if $IM "$f" -strip -depth 8 -interlace none -define png:color-type=6 "PNG32:$f.fixed" 2>/dev/null && [ -s "$f.fixed" ]; then
              mv -f "$f.fixed" "$f"; FIXED=$((FIXED+1))
            else
              rm -f "$f.fixed"; BAD=$((BAD+1))
              echo "⚠️ PNG tidak bisa dibaca, diganti ikon polos: $f"
              SZ=96; case "$f" in *mipmap-mdpi*) SZ=48;; *mipmap-hdpi*) SZ=72;; *mipmap-xhdpi*) SZ=96;; *mipmap-xxhdpi*) SZ=144;; *mipmap-xxxhdpi*) SZ=192;; esac
              case "$(basename "$f")" in
                ic_launcher*) $IM -size ${SZ}x${SZ} xc:'#2196F3' "PNG32:$f" ;;
                *) rm -f "$f" ;;
              esac
            fi
          done < <(find "$DIR" -type f -iname '*.png' -path '*/src/main/res/*' \( -path '*/mipmap*' -o -path '*/drawable*' \) -not -path '*/build/*' 2>/dev/null)
          echo "✅ Sanitasi PNG resource: $FIXED diperbaiki, $BAD tidak terbaca"
          exit 0

      - name: Clean stale artifacts from ZIP (build dari nol)
        run: |
          set +e
          DIR="${{ steps.detect.outputs.dir }}"
          echo "Bersihkan sisa build bawaan ZIP di: $DIR"
          # Hanya folder hasil build di lokasi standar (jangan hapus folder source bernama "build")
          for d in "$DIR/build" "$DIR/.dart_tool" "$DIR/.gradle" "$DIR/android/.gradle" \
                   "$DIR/android/build" "$DIR/android/app/build" "$DIR/.gradle" "$DIR/ios/Pods"; do
            [ -d "$d" ] && { echo "hapus $d"; rm -rf "$d"; }
          done
          rm -f "$DIR/.flutter-plugins" "$DIR/.flutter-plugins-dependencies" "$DIR/.packages" "$DIR/pubspec.lock.bak" 2>/dev/null
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" 2>/dev/null
          echo "✅ Bersih. Build jalan tanpa cache."
          exit 0

      - name: Tune gradle.properties
        run: |
          set -euo pipefail
          GP="${{ steps.detect.outputs.dir }}/android/gradle.properties"
          mkdir -p "$(dirname "$GP")"
          touch "$GP"
          sed -i '/kotlin.jvm.target.validation.mode/d' "$GP" || true
          sed -i '/# >>> DEY BUILD WORKER >>>/,/# <<< DEY BUILD WORKER <<</d;/# >>> RIZQY BUILD WORKER >>>/,/# <<< RIZQY BUILD WORKER <<</d' "$GP" || true
          sed -i '/org.gradle.jvmargs/d;/org.gradle.parallel/d;/org.gradle.caching/d;/org.gradle.daemon/d;/org.gradle.configureondemand/d;/org.gradle.workers.max/d' "$GP" || true
          RAM_MB=$(free -m | awk '/^Mem:/{print $2}'); RAM_MB=${RAM_MB:-7000}
          CPUS=$(nproc 2>/dev/null || echo 2)
          if   [ "$RAM_MB" -lt 6144 ];  then XMX=2048; elif [ "$RAM_MB" -lt 10240 ]; then XMX=3072; else XMX=4096; fi
          WORKERS=$CPUS; [ "$WORKERS" -gt 4 ] && WORKERS=4
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx${XMX}m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=false"
            echo "org.gradle.daemon=false"
            echo "org.gradle.workers.max=$WORKERS"
            echo "kotlin.jvm.target.validation.mode=warning"
          } >> "$GP"
          # useAndroidX hanya ditambah kalau project tidak punya; Jetifier TIDAK dipaksa (memperlambat, project yang butuh sudah menyetel sendiri)
          grep -q '^android.useAndroidX' "$GP" || echo "android.useAndroidX=true" >> "$GP"
          echo "RAM=${RAM_MB}MB CPU=${CPUS} Xmx=${XMX}m workers=${WORKERS}"
          echo "GRADLE_XMX=$XMX" >> "$GITHUB_ENV"

      - name: Speed up Gradle (skip lintVital)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          echo '' | base64 -d > "$HOME/.gradle/init.d/fastbuild.gradle"
          echo "✅ init script terpasang:"
          cat "$HOME/.gradle/init.d/fastbuild.gradle"

      - name: Use preinstalled NDK (skip download)
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_VER=$(ls -1 "$SDK/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_VER" ]; then
            echo "ℹ️ Gak ada NDK preinstalled di $SDK/ndk -- biarin Gradle download."
            exit 0
          fi
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ] && grep -qE 'ndkVersion[[:space:]]*=?[[:space:]]*flutter\.ndkVersion' "$f"; then
              sed -i -E 's/ndkVersion[[:space:]]*=?[[:space:]]*flutter\.ndkVersion/ndkVersion = "'"$NDK_VER"'"/' "$f"
              echo "✅ $f -> ndkVersion = $NDK_VER (preinstalled, gak perlu download)"
              exit 0
            fi
          done
          echo "ℹ️ Baris 'ndkVersion = flutter.ndkVersion' gak ketemu -- dilewati."

      - name: Build Flutter APK
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          ALT_FLUTTER: ${{ steps.fv.outputs.alt }}
        run: |
          set -euo pipefail
          export BOT=true
          BT="$BUILD_TYPE"

          # Skrip auto-fix error Dart (pola pasti saja, tanpa AI, tidak mengarang isi yang hilang dari ZIP)
          cat > /tmp/autofix.js <<'AUTOFIX_JS'
          'use strict';
          // Auto-fix aman (tanpa AI, tanpa mengarang isi) untuk error kompilasi Dart yang polanya pasti.
          // Pakai: node autofix.js <build.log> <root project>   Exit 0 = ada file diubah, 3 = tidak ada yang bisa diperbaiki.
          const fs = require('fs');
          const path = require('path');
          const logPath = process.argv[2];
          const root = path.resolve(process.argv[3] || '.');
          const log = fs.readFileSync(logPath, 'utf8').replace(/\r/g, '');
          const posix = (p) => p.split(path.sep).join('/');

          let pkgName = '';
          try { const m = fs.readFileSync(path.join(root, 'pubspec.yaml'), 'utf8').match(/^name:\s*["']?([A-Za-z0-9_]+)/m); if (m) pkgName = m[1]; } catch (_) {}

          // ---- kumpulkan error dari log ----
          function normFile(raw) {
            let f = raw.replace(/\\/g, '/');
            if (/\.pub-cache|^package:|^dart:|^file:/.test(f)) return null;
            const abs = path.isAbsolute(f) ? f : path.join(root, f);
            const rel = posix(path.relative(root, abs));
            if (rel.startsWith('lib/') && fs.existsSync(path.join(root, rel))) return rel;
            const i = f.lastIndexOf('lib/');
            if (i >= 0 && fs.existsSync(path.join(root, f.slice(i)))) return f.slice(i);
            return null;
          }
          const errors = [];
          const re = /^(\S+?\.dart):(\d+):(\d+): Error: (.*)$/gm;
          let m;
          while ((m = re.exec(log))) {
            const file = normFile(m[1]);
            if (file) errors.push({ file, line: +m[2], col: +m[3], msg: m[4].trim() });
          }
          if (!errors.length) { console.log('autofix: tidak ada error Dart yang dikenali di log'); process.exit(3); }

          // ---- file lib/ dan indeks deklarasi top-level ----
          const libFiles = [];
          (function walk(d) {
            let ents = []; try { ents = fs.readdirSync(d, { withFileTypes: true }); } catch (_) { return; }
            for (const e of ents) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) { if (!/^(\.|build$)/.test(e.name)) walk(p); }
              else if (e.name.endsWith('.dart')) libFiles.push(posix(path.relative(root, p)));
            }
          })(path.join(root, 'lib'));

          const texts = new Map();
          const read = (f) => { if (!texts.has(f)) texts.set(f, fs.readFileSync(path.join(root, f), 'utf8')); return texts.get(f); };
          const edits = new Map(); // file -> [{start,end,text}]
          const addEdit = (f, e) => { if (!edits.has(f)) edits.set(f, []); const l = edits.get(f); if (!l.some((x) => x.start === e.start && x.end === e.end)) l.push(e); };
          const fixes = [];

          function offsetOf(text, line, col) {
            let off = 0;
            for (let i = 1; i < line; i++) { const n = text.indexOf('\n', off); if (n < 0) return -1; off = n + 1; }
            return off + col - 1;
          }

          // ---- 1) const yang tidak valid: hapus semua `const` yang membungkus, atau const -> final untuk deklarasi ----
          const CONST_RE = /not a constant expression|Constant expression expected|isn't a const constructor|non-'const' constructor where a const|Invalid constant value|must be initialized with a constant|Cannot invoke a non-'const'|isn't a constant expression|can't be used in a constant|Not a constant expression/i;
          function enclosingConsts(text, offset) {
            const found = []; let depth = 0;
            for (let i = offset - 1, steps = 0; i >= 0 && steps < 40000; i--, steps++) {
              const c = text[i];
              if (c === ')' || c === ']' || c === '}') depth++;
              else if (c === '(' || c === '[' || c === '{') {
                if (depth > 0) { depth--; continue; }
                let j = i - 1;
                while (j >= 0 && /\s/.test(text[j])) j--;
                if (text[j] === '>') { let d = 0; for (; j >= 0; j--) { if (text[j] === '>') d++; else if (text[j] === '<') { d--; if (d === 0) { j--; break; } } } while (j >= 0 && /\s/.test(text[j])) j--; }
                let k = j; while (k >= 0 && /[A-Za-z0-9_$.]/.test(text[k])) k--;
                const before = text.slice(Math.max(0, k - 12), k + 1);
                const cm = before.match(/(?:^|[^A-Za-z0-9_$])const\s*$/);
                if (cm) { const end = k + 1; const start = end - (before.length - before.search(/const\s*$/)); found.push({ start, end }); }
              }
            }
            return found;
          }
          for (const e of errors.filter((x) => CONST_RE.test(x.msg))) {
            const text = read(e.file); const off = offsetOf(text, e.line, e.col); if (off < 0) continue;
            if (/must be initialized with a constant/i.test(e.msg)) {
              const ls = text.lastIndexOf('\n', off - 1) + 1; const le = text.indexOf('\n', off); const line = text.slice(ls, le < 0 ? undefined : le);
              const cm = line.match(/\bconst\b/);
              if (cm) { addEdit(e.file, { start: ls + cm.index, end: ls + cm.index + 5, text: 'final' }); fixes.push(`${e.file}:${e.line} const -> final (nilai bukan konstan)`); }
              continue;
            }
            const cs = enclosingConsts(text, off);
            if (cs.length) {
              for (const c of cs) { let end = c.end; while (/\s/.test(text[end])) end++; addEdit(e.file, { start: c.start, end, text: '' }); }
              fixes.push(`${e.file}:${e.line} hapus 'const' pembungkus (${cs.length}x)`);
            } else {
              // deklarasi: static const x = fungsi(); -> static final
              let s = off; while (s > 0 && !';{}'.includes(text[s - 1])) s--;
              const seg = text.slice(s, off); const cm = seg.match(/\bconst\b/);
              if (cm) { addEdit(e.file, { start: s + cm.index, end: s + cm.index + 5, text: 'final' }); fixes.push(`${e.file}:${e.line} const -> final pada deklarasi`); }
            }
          }

          // ---- 2) nama tidak terdefinisi: cari deklarasi top-level di file lain lalu tambah import ----
          const UNDEF = [/Undefined name '(\w+)'/, /The getter '(\w+)' isn't defined for the (?:type|class)/, /The method '(\w+)' isn't defined for the (?:type|class)/, /The setter '(\w+)' isn't defined for the (?:type|class)/];
          function topLevelDefs(name) {
            const re = new RegExp('^(?:(?:final|const|var|late|static)\\s+)*(?:[A-Za-z_][\\w<>,?\\s]*\\s+)?' + name + '\\s*(?:=|\\(|;)', 'm');
            const out = [];
            for (const f of libFiles) {
              let t; try { t = read(f); } catch (_) { continue; }
              if (/^part of\b/m.test(t)) continue;
              if (re.test(t) || new RegExp('^(?:class|enum|mixin|typedef|extension)\\s+' + name + '\\b', 'm').test(t)) out.push(f);
            }
            return out;
          }
          function addImport(file, importLine) {
            const t = read(file);
            if (t.includes(importLine)) return false;
            let pos = 0; const re2 = /^(?:import|export)\s+[^;]+;[ \t]*\r?\n?/gm; let mm;
            while ((mm = re2.exec(t))) pos = mm.index + mm[0].length;
            addEdit(file, { start: pos, end: pos, text: importLine + '\n' });
            return true;
          }
          const handledImports = new Set();
          for (const e of errors) {
            let name = null;
            for (const r of UNDEF) { const x = e.msg.match(r); if (x) { name = x[1]; break; } }
            if (!name) continue;
            const key = e.file + '|' + name; if (handledImports.has(key)) continue; handledImports.add(key);
            const defs = topLevelDefs(name).filter((f) => f !== e.file);
            if (defs.length && pkgName) {
              const target = defs[0];
              if (addImport(e.file, `import 'package:${pkgName}/${target.replace(/^lib\//, '')}';`)) fixes.push(`${e.file}: '${name}' didefinisikan di ${target}, import ditambahkan`);
            } else {
              console.log(`::warning::autofix: '${name}' dipakai di ${e.file}:${e.line} tetapi tidak ada definisinya di project (kemungkinan file hilang dari ZIP). Tidak dikarang otomatis.`);
            }
          }

          // ---- 3) import ke file yang tidak ada: cari file bernama sama di tempat lain di lib/ ----
          for (const e of errors) {
            const x = e.msg.match(/Error when reading '([^']+)': No such file or directory/); if (!x) continue;
            const missing = x[1]; const base = path.posix.basename(missing).toLowerCase();
            const cands = libFiles.filter((f) => path.posix.basename(f).toLowerCase() === base && f !== missing);
            if (!cands.length) { console.log(`::warning::autofix: ${missing} tidak ada di ZIP dan tidak ada file bernama sama di lib/ (file hilang dari ZIP)`); continue; }
            const target = cands.sort((a, b) => b.split('/').filter((s) => missing.includes(s)).length - a.split('/').filter((s) => missing.includes(s)).length)[0];
            const text = read(e.file); const ls = offsetOf(text, e.line, 1); const le = text.indexOf('\n', ls); const line = text.slice(ls, le < 0 ? undefined : le);
            const q = line.match(/(['"])([^'"]+)\1/); if (!q) continue;
            const old = q[2]; let neu;
            if (old.startsWith('package:')) neu = `package:${pkgName || old.split('/')[0].slice(8)}/${target.replace(/^lib\//, '')}`;
            else { neu = posix(path.relative(path.dirname(e.file), target)); }
            const at = ls + line.indexOf(q[0]) + 1;
            addEdit(e.file, { start: at, end: at + old.length, text: neu });
            fixes.push(`${e.file}:${e.line} import ${old} -> ${neu} (file ada di ${target})`);
          }

          // ---- terapkan ----
          let changed = 0;
          for (const [f, list] of edits) {
            let t = read(f);
            for (const ed of list.sort((a, b) => b.start - a.start)) t = t.slice(0, ed.start) + ed.text + t.slice(ed.end);
            fs.writeFileSync(path.join(root, f), t); changed++;
          }
          for (const f of fixes) console.log('AUTOFIX: ' + f);
          if (!changed) { console.log('autofix: tidak ada perbaikan otomatis yang cocok'); process.exit(3); }
          console.log(`autofix: ${changed} file diubah, ${fixes.length} perbaikan`);
          process.exit(0);
          AUTOFIX_JS

          # 1) Java 17, kecuali Gradle project < 7.6 memakai Java 11
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          [ -f "$WRAPPER_PROPS" ] || WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"
          JAVA_PICK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          if [ -f "$WRAPPER_PROPS" ]; then
            GV=$(grep 'distributionUrl' "$WRAPPER_PROPS" | grep -oE 'gradle-[0-9]+\.[0-9]+' | head -1 | sed 's/gradle-//' || true)
            GM=$(echo "$GV" | cut -d. -f1); GN=$(echo "$GV" | cut -d. -f2)
            if [ -n "${JAVA_HOME_11_X64:-}" ] && [ -n "$GM" ] && { [ "$GM" -lt 7 ] || { [ "$GM" -eq 7 ] && [ "${GN:-0}" -lt 6 ]; }; }; then JAVA_PICK="$JAVA_HOME_11_X64"; fi
          fi
          export JAVA_HOME="$JAVA_PICK"; export PATH="$JAVA_HOME/bin:$PATH"
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter config --jdk-dir "$JAVA_HOME" >/dev/null 2>&1 || true
          echo "Java: $JAVA_HOME (gradle wrapper: ${GV:-?})"

          # 2) Android SDK: pasang HANYA compileSdk/build-tools/NDK eksplisit yang diminta project dan belum ada
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ]; then
            export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
            export PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools"
            flutter config --android-sdk "$SDK" >/dev/null 2>&1 || true
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ] && [ "$MODE" = "zip" ]; then
              CS=$(grep -RhoE 'compileSdk(Version)?[^0-9]*[0-9]+' android 2>/dev/null | grep -oE '[0-9]+$' | sort -nr | head -1 || true)
              BTV=$(grep -RhoE 'buildToolsVersion[^0-9]*[0-9.]+' android 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              NDKV=$(grep -RhoE 'ndkVersion[^0-9]*[0-9.]+' android 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              [ -n "$CS" ]   && { [ -d "$SDK/platforms/android-$CS" ] || yes | "$SDKM" "platforms;android-$CS" >/dev/null 2>&1 || true; }
              [ -n "$BTV" ]  && { [ -d "$SDK/build-tools/$BTV" ]      || yes | "$SDKM" "build-tools;$BTV" >/dev/null 2>&1 || true; }
              [ -n "$NDKV" ] && { [ -d "$SDK/ndk/$NDKV" ]             || yes | "$SDKM" "ndk;$NDKV" >/dev/null 2>&1 || true; }
            fi
          fi

          # Pasang satu rilis Flutter dari arsip resmi dan jadikan itu "flutter" aktif (dir terpisah per versi)
          install_flutter_archive() {
            local FV="$1" AR="$2"
            echo "⬆️ Pasang Flutter $FV (arsip $AR)"
            mkdir -p "$HOME/flutter_$FV"
            curl -fsSL -o /tmp/flutter_dl.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/$AR" || return 1
            tar -xf /tmp/flutter_dl.tar.xz -C "$HOME/flutter_$FV" || return 1
            rm -f /tmp/flutter_dl.tar.xz
            export FLUTTER_ROOT="$HOME/flutter_$FV/flutter"
            export PATH="$FLUTTER_ROOT/bin:$PATH"
            git config --global --add safe.directory "$FLUTTER_ROOT" 2>/dev/null || true
            flutter config --no-analytics >/dev/null 2>&1 || true
            flutter config --jdk-dir "$JAVA_HOME" >/dev/null 2>&1 || true
            [ -n "${SDK:-}" ] && flutter config --android-sdk "$SDK" >/dev/null 2>&1 || true
            flutter --version
            return 0
          }

          # Pasang Flutter stable dengan nomor versi persis (dicari di katalog resmi)
          install_flutter_version() {
            local WANT="$1" AR
            AR=$(WANT="$WANT" node - <<'NODE3'
          const https = require('https');
          https.get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json', (res) => {
            let d = ''; res.on('data', (c) => d += c);
            res.on('end', () => {
              try {
                const r = (JSON.parse(d).releases || []).find((x) => x.channel === 'stable' && x.archive && x.version === process.env.WANT);
                if (r) console.log(r.archive);
              } catch (e) {}
            });
          }).on('error', () => {});
          NODE3
            )
            if [ -z "$AR" ]; then echo "::warning::Flutter $WANT tidak ada di katalog stable"; return 1; fi
            install_flutter_archive "$WANT" "$AR"
          }

          # 3a-0) Dependency (mis. better_player dari git) butuh Dart SDK lebih baru dari Flutter terpilih
          #       ("requires SDK version >=3.12.0"). Pasang Flutter stable terendah yang Dart-nya cukup.
          upgrade_flutter_for_dart() {
            local NEED="$1"
            echo "ℹ️ Dependency butuh Dart >= $NEED, mencari Flutter stable yang cocok"
            local PICK
            PICK=$(NEED="$NEED" node - <<'NODE2'
          const https = require('https');
          const need = process.env.NEED.split('.').map(Number);
          while (need.length < 3) need.push(0);
          const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
          https.get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json', (res) => {
            let d = ''; res.on('data', (c) => d += c);
            res.on('end', () => {
              try {
                const rel = (JSON.parse(d).releases || []).filter((r) => r.channel === 'stable' && r.archive && r.dart_sdk_version);
                const ok = rel.filter((r) => { const m = String(r.dart_sdk_version).match(/(\d+)\.(\d+)\.(\d+)/); return m && cmp([+m[1], +m[2], +m[3]], need) >= 0 && +m[1] < 4; });
                // Ambil yang paling lama (lompatan versi sekecil mungkin supaya project tidak banyak rusak)
                ok.sort((a, b) => String(a.release_date).localeCompare(String(b.release_date)));
                if (ok.length) console.log(ok[0].version + ' ' + ok[0].archive);
              } catch (e) {}
            });
          }).on('error', () => {});
          NODE2
            )
            if [ -z "$PICK" ]; then echo "::warning::Tidak ada Flutter stable dengan Dart >= $NEED di katalog resmi"; return 1; fi
            install_flutter_archive "${PICK%% *}" "${PICK#* }"
            return $?
          }

          # 3a-ns) Plugin Android lama (mis. better_player dari git) tidak punya `namespace` di build.gradle,
          #        padahal AGP 8+ mewajibkannya: build gagal "A problem occurred configuring project ':nama_plugin'".
          #        Tambahkan namespace (diambil dari package di AndroidManifest plugin) ke plugin yang belum punya.
          patch_plugin_namespace() {
            [ -f .dart_tool/package_config.json ] || return 0
            echo "🔧 Cek namespace plugin Android"
            node - <<'NODE_NS' || true
          const fs = require('fs'), path = require('path'), { fileURLToPath, pathToFileURL } = require('url');
          const base = pathToFileURL(path.resolve('.dart_tool') + path.sep);
          let cfg; try { cfg = JSON.parse(fs.readFileSync('.dart_tool/package_config.json', 'utf8')); } catch (e) { process.exit(0); }
          const app = path.resolve('.');
          for (const p of cfg.packages || []) {
            let root; try { root = fileURLToPath(new URL(p.rootUri.endsWith('/') ? p.rootUri : p.rootUri + '/', base)); } catch (e) { continue; }
            if (path.resolve(root) === app) continue;
            for (const [fn, kts] of [['build.gradle', false], ['build.gradle.kts', true]]) {
              const g = path.join(root, 'android', fn);
              if (!fs.existsSync(g)) continue;
              let s = fs.readFileSync(g, 'utf8');
              if (/^\s*namespace\s*[=\s'"]/m.test(s)) break;
              let pkg = null;
              try { pkg = (fs.readFileSync(path.join(root, 'android/src/main/AndroidManifest.xml'), 'utf8').match(/package\s*=\s*"([^"]+)"/) || [])[1]; } catch (e) {}
              if (!pkg) pkg = 'patched.' + p.name.replace(/[^a-zA-Z0-9_]/g, '_');
              const line = kts ? `namespace = "${pkg}"` : `namespace '${pkg}'`;
              const out = s.replace(/^(\s*)android\s*\{/m, (m, i) => `${m}\n${i}    ${line}`);
              if (out !== s) { fs.writeFileSync(g, out); console.log(`  namespace ditambah: ${p.name} -> ${pkg}`); }
              break;
            }
          }
          NODE_NS
            return 0
          }

          # 3a) pub get yang tahan konflik versi dependency ("version solving failed").
          #     Ini beda dengan versi Flutter SDK: ini konflik batas versi antar package di pubspec.yaml.
          resolve_pub_get() {
            flutter pub get 2>&1 | tee pub_get.log
            local RCP=${PIPESTATUS[0]}
            [ "$RCP" -eq 0 ] && return 0
            if [ -f pubspec.lock ]; then
              echo "⚠️ pub get gagal dengan pubspec.lock dari ZIP, coba ulang tanpa lock"
              rm -f pubspec.lock
              flutter pub get 2>&1 | tee pub_get.log
              RCP=${PIPESTATUS[0]}
              [ "$RCP" -eq 0 ] && return 0
            fi
            if ! grep -qiE 'version solving failed|Because .* depends on|requires SDK version' pub_get.log; then return "$RCP"; fi
            NEED_DART=$(grep -oE 'SDK version (>=|\^)[0-9]+\.[0-9]+(\.[0-9]+)?' pub_get.log | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V | tail -n 1 || true)
            if [ -n "$NEED_DART" ] && upgrade_flutter_for_dart "$NEED_DART"; then
              rm -f pubspec.lock
              flutter pub get 2>&1 | tee pub_get.log
              [ "${PIPESTATUS[0]}" -eq 0 ] && { echo "✅ pub get berhasil setelah Flutter dinaikkan"; return 0; }
            fi
            echo "⚠️ Konflik versi dependency terdeteksi, mencoba perbaikan otomatis (pubspec asli disimpan)"
            cp pubspec.yaml pubspec.yaml.orig
            OWN_PKG=$(grep -m1 -E '^name:' pubspec.yaml | sed -E 's/^name:[[:space:]]*//; s/["'"'"'[:space:]]//g' || true)
            # Langkah A: longgarkan batas versi package hosted yang disebut di error (^2.5.3 -> any),
            # supaya pub memilih versi yang cocok dengan package git/lainnya.
            NAMES=$(grep -oE '(depends on( both)?|and) [a-z_][a-z0-9_]*' pub_get.log | awk '{print $NF}' | sort -u | grep -vxE "flutter|sdk|${OWN_PKG:-__none__}" || true)
            CHANGED=0
            for N in $NAMES; do
              if grep -qE "^  $N:[[:space:]]*[\\^<>=~0-9'\"]" pubspec.yaml; then
                sed -i -E "s/^(  $N:)[[:space:]]*[\\^<>=~0-9'\"][^#]*/\\1 any/" pubspec.yaml
                echo "  longgarkan versi: $N -> any"; CHANGED=1
              fi
            done
            if [ "$CHANGED" -eq 1 ]; then
              rm -f pubspec.lock
              flutter pub get 2>&1 | tee pub_get.log
              [ "${PIPESTATUS[0]}" -eq 0 ] && { echo "✅ Konflik beres dengan melonggarkan versi package"; return 0; }
              cp pubspec.yaml.orig pubspec.yaml
            fi
            # Langkah C: dependency_overrides, dipilih oleh COMPILER (bukan ditebak). Dipakai kalau konflik datang dari
            # package git/path (mis. better_player) yang batas versinya tidak bisa dilonggarkan lewat pubspec project.
            # Package hosted yang disebut di rantai konflik di-override dengan 3 kandidat, berurutan:
            #   git  = batas versi yang diminta package git/path (kode package git tidak bisa diubah, jadi dijaga dulu)
            #   host = batas versi yang diminta package hosted lain
            #   any  = tanpa batas (versi terbaru)
            #   hosted = pilihan terakhir: package yang ber-sumber git dan ikut konflik diganti ke versi pub.dev (any),
            #            lalu dicek compile juga. Berguna kalau batas versi package git itu sendiri yang mustahil dipenuhi.
            # Tiap kandidat yang lolos pub get dites compile cepat (flutter build bundle = kompilasi Dart ke kernel,
            # tanpa Gradle). Kandidat pertama yang compile dipakai. Kalau tidak ada yang compile, kandidat pertama yang
            # lolos pub get tetap dipakai supaya build asli menampilkan error sebenarnya. Package git/path/sdk tidak
            # pernah di-override (sumbernya tidak boleh berganti jadi hosted).
            cp pub_get.log pub_conflict.log
            CAND=""; TRIED=""
            for MODE in git host any hosted; do
              cp pubspec.yaml.orig pubspec.yaml
              cp pub_conflict.log pub_get.log
              PUB_OK=0
              for ROUND in 1 2 3; do
                ADDED=$(MODE="$MODE" node - <<'NODE_OVR'
          const fs = require('fs');
          const mode = process.env.MODE;
          const log = fs.readFileSync('pub_get.log', 'utf8');
          let y = fs.readFileSync('pubspec.yaml', 'utf8');
          const own = ((y.match(/^name:\s*["']?([A-Za-z0-9_]+)/m) || [])[1]) || '__none__';
          const skip = new Set(['flutter', 'sdk', 'dart', 'which', 'flutter_test', 'flutter_web_plugins', 'flutter_localizations', own]);
          const lines = y.split('\n');
          const nonHosted = (n) => {
            for (let i = 0; i < lines.length; i++) {
              const m = lines[i].match(new RegExp('^  ' + n + ':\\s*(.*)$'));
              if (!m) continue;
              if (/\b(git|path|sdk)\b/.test(m[1])) return true;
              for (let j = i + 1; j < lines.length; j++) {
                if (/^\s*(#.*)?$/.test(lines[j])) continue;
                if (/^ {4,}/.test(lines[j])) { if (/^\s+(git|path|sdk):/.test(lines[j])) return true; } else break;
              }
              return false;
            }
            return false;
          };
          const existing = new Set();
          const ov = y.match(/^dependency_overrides:[ \t]*\n((?:[ \t]+.*\n?|\n)*)/m);
          if (ov) for (const l of ov[1].split('\n')) { const m = l.match(/^  ([a-z_][a-z0-9_]*):/); if (m) existing.add(m[1]); }
          const found = new Set();
          const re = /(?:depends on(?: both)?|\band|\bor)\s+([a-z_][a-z0-9_]*)\s+(?:[\^<>=~]|\d|any\b|from\b)/g;
          let m;
          while ((m = re.exec(log))) found.add(m[1]);
          // Siapa meminta versi berapa: "<subjek> [from git | <versi>] depends on <paket> <batas>"
          const gitC = {}, hostC = {};
          const cre = /([a-z_][a-z0-9_]*)(?:\s+from\s+(git|path))?(?:\s+[\^<>=~]*\d[^\s,]*(?:\s+<=?\d[^\s,]*)?)?\s+depends on\s+([a-z_][a-z0-9_]*)\s+([\^<>=~]*\d[^\s,]*(?:\s+<=?\d[^\s,]*)?|any)/g;
          while ((m = cre.exec(log))) {
            const subj = m[1], tgt = m[3], c = m[4].replace(/[.;]+$/, '');
            if (subj === 'which' || subj === own) continue;
            const map = (m[2] || nonHosted(subj)) ? gitC : hostC;
            if (!map[tgt]) map[tgt] = c;
          }
          const gitOnly = (n) => {
            for (let i = 0; i < lines.length; i++) {
              const mm = lines[i].match(new RegExp('^  ' + n + ':\\s*(.*)$'));
              if (!mm) continue;
              if (/\bgit\b/.test(mm[1])) return true;
              for (let j = i + 1; j < lines.length; j++) {
                if (/^\s*(#.*)?$/.test(lines[j])) continue;
                if (/^ {4,}/.test(lines[j])) { if (/^\s+git:/.test(lines[j])) return true; } else break;
              }
              return false;
            }
            return false;
          };
          const add = [...found].filter((n) => !skip.has(n) && !existing.has(n) && !nonHosted(n));
          const swap = mode === 'hosted' ? [...found].filter((n) => !skip.has(n) && gitOnly(n)) : [];
          if (!add.length && !swap.length) process.exit(0);
          if (swap.length) {
            const ls = y.split('\n');
            for (const n of swap) {
              const i = ls.findIndex((l) => new RegExp('^  ' + n + ':').test(l));
              if (i < 0) continue;
              let j = i + 1;
              while (j < ls.length && (/^ {4,}\S/.test(ls[j]) || /^\s*(#.*)?$/.test(ls[j]) && j + 1 < ls.length && /^ {4,}\S/.test(ls[j + 1]))) j++;
              ls.splice(i, j - i, '  ' + n + ': any');
            }
            y = ls.join('\n');
          }
          const val = (n) => mode === 'git' ? (gitC[n] || 'any') : mode === 'host' ? (hostC[n] || 'any') : 'any';
          const q = (v) => (v === 'any' || /^\^?\d[^\s]*$/.test(v)) ? v : "'" + v + "'";
          if (!add.length) { fs.writeFileSync('pubspec.yaml', y); console.log(swap.map((n) => 'ganti-git->pub.dev:' + n).join(' ')); process.exit(0); }
          const block = add.map((n) => '  ' + n + ': ' + q(val(n))).join('\n');
          if (/^dependency_overrides:[ \t]*$/m.test(y)) {
            y = y.replace(/^dependency_overrides:[ \t]*$/m, (h) => h + '\n' + block);
          } else {
            y = y.replace(/\s*$/, '\n') + '\ndependency_overrides:\n' + block + '\n';
          }
          fs.writeFileSync('pubspec.yaml', y);
          console.log(add.map((n) => n + '=' + val(n)).concat(swap.map((n) => 'ganti-git->pub.dev:' + n)).join(' '));
          NODE_OVR
                )
                [ -z "$ADDED" ] && break
                if [ "$ROUND" -eq 1 ]; then
                  SUM=$(md5sum pubspec.yaml | cut -d' ' -f1)
                  case " $TRIED " in *" $SUM "*) ADDED=""; break ;; esac
                  TRIED="$TRIED $SUM"
                fi
                echo "  [override:$MODE] putaran $ROUND: $ADDED"
                rm -f pubspec.lock
                flutter pub get 2>&1 | tee pub_get.log
                if [ "${PIPESTATUS[0]}" -eq 0 ]; then PUB_OK=1; break; fi
              done
              [ "$PUB_OK" -eq 1 ] || continue
              if [ ! -f lib/main.dart ]; then
                echo "::warning::Konflik beres lewat dependency_overrides [$MODE] ($ADDED), compile belum dites (lib/main.dart tidak ada)"
                return 0
              fi
              echo "🔎 [override:$MODE] pub get lolos, tes compile cepat (flutter build bundle)"
              if timeout 900 flutter build bundle > bundle_check.log 2>&1; then
                echo "✅ Konflik beres dengan dependency_overrides [$MODE] dan compile lolos: $ADDED"
                return 0
              fi
              echo "⚠️ [override:$MODE] compile gagal, coba kandidat berikutnya:"
              grep -E 'Error|error:' bundle_check.log | head -n 5 || true
              if [ -z "$CAND" ]; then CAND="$MODE"; cp pubspec.yaml pubspec.yaml.cand; cp pubspec.lock pubspec.lock.cand 2>/dev/null || true; fi
            done
            if [ -n "$CAND" ]; then
              cp pubspec.yaml.cand pubspec.yaml; cp pubspec.lock.cand pubspec.lock 2>/dev/null || true
              echo "::warning::Tidak ada kandidat override yang lolos tes compile. Memakai [$CAND]; error aslinya akan muncul di build. Ganti package git itu di pubspec bila perlu."
              return 0
            fi
            cp pubspec.yaml.orig pubspec.yaml
            # Langkah B: naikkan semua constraint hosted ke versi terbaru yang saling cocok
            rm -f pubspec.lock
            flutter pub upgrade --major-versions 2>&1 | tee pub_get.log
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then echo "✅ Konflik beres dengan pub upgrade --major-versions"; return 0; fi
            cp pubspec.yaml.orig pubspec.yaml
            echo "::error::Konflik dependency tidak bisa diselesaikan otomatis. Lihat pub_get.log"
            return "$RCP"
          }

          # 3) pub get (tanpa flutter clean: runner baru + langkah "Clean stale artifacts" sudah bersih)
          if [ "$MODE" != "url" ]; then
            # "|| exit $?" wajib: tanpa ini, set -e mematikan script di pub get pertama yang gagal dan perbaikan otomatis tidak pernah jalan
            resolve_pub_get || exit $?
            patch_plugin_namespace
            if [ -f pubspec.yaml ] && grep -q "flutter_launcher_icons:" pubspec.yaml; then
              flutter pub run flutter_launcher_icons || echo "::warning::Pembuatan ikon launcher gagal, build lanjut"
            fi
            if [ -d "android/app/src/main/res" ]; then
              find android/app/src/main/res/mipmap-* \( -name "ic_launcher*.png" -o -name "ic_launcher*.jpg" \) -size 0 -delete 2>/dev/null || true
              for mipmap in android/app/src/main/res/mipmap-*; do
                [ -d "$mipmap" ] || continue
                for icon in "$mipmap"/ic_launcher*.jpg; do
                  [ -f "$icon" ] || continue
                  b=$(basename "$icon" .jpg)
                  [ -f "$mipmap/$b.png" ] && rm -f "$icon"
                done
              done
            fi
          fi

          # 4) local.properties
          FLUTTER_SDK_PATH=$(dirname "$(dirname "$(command -v flutter)")")
          mkdir -p android
          if [ -n "$SDK" ]; then echo "sdk.dir=$SDK" > android/local.properties; else : > android/local.properties; fi
          echo "flutter.sdk=$FLUTTER_SDK_PATH" >> android/local.properties

          # 5) Entry point: lib/main.dart, kalau tidak ada cari file lain yang punya main()
          TARGET_ARGS=""
          if [ ! -f lib/main.dart ]; then
            ALT=$(ls lib/main_*.dart lib/*/main.dart 2>/dev/null | head -n 1 || true)
            if [ -z "$ALT" ] && [ -d lib ]; then
              ALT=$(grep -rlE '^[[:space:]]*(void|Future<void>)[[:space:]]+main[[:space:]]*\(' lib --include='*.dart' 2>/dev/null | head -n 1 || true)
            fi
            if [ -n "$ALT" ]; then
              echo "lib/main.dart tidak ada, memakai entry point: $ALT"
              TARGET_ARGS="-t $ALT"
            else
              echo "::error::Target file \"lib/main.dart\" not found. Tidak ada file Dart dengan fungsi main() di $(pwd)."
              ls -la; ls -la lib 2>/dev/null || echo "(folder lib tidak ada)"
              exit 1
            fi
          fi

          # 6) Tunggu pembersihan disk background (biasanya sudah selesai jauh sebelum sampai sini)
          for i in $(seq 1 60); do [ -f /tmp/free_disk_done ] && break; sleep 3; done
          df -h / | tail -n 1

          # 7) Build jalur cepat: 2 ABI saja (arm, arm64), tanpa shrink/tree-shake, --no-pub (pub get sudah dijalankan)
          set +e
          BUILD_CMD="flutter build apk --$BT $TARGET_ARGS --target-platform=$TARGET_PLATFORMS --no-tree-shake-icons --no-shrink --no-pub"
          $BUILD_CMD 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          # Satu kali ulang HANYA kalau daemon mati / kehabisan memori, dengan heap dinaikkan (bukan ulang dengan setelan sama)
          if [ "$RC" -ne 0 ] && grep -qiE 'daemon has disappeared|daemon disappeared|Gradle build daemon disappeared|OutOfMemoryError|Java heap space|GC overhead' build.log; then
            echo "Gradle kehabisan memori / daemon mati, ulang sekali dengan heap lebih besar"
            (cd android && ./gradlew --stop >/dev/null 2>&1 || true)
            GP="android/gradle.properties"
            sed -i -E "s/^org.gradle.jvmargs=-Xmx[0-9]+m/org.gradle.jvmargs=-Xmx$(( ${GRADLE_XMX:-3072} + 1024 ))m/" "$GP" || true
            $BUILD_CMD 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi
          # compileSdk terlalu rendah ("... compile against version 36 or later of the Android APIs"):
          # naikkan compileSdk ke angka yang diminta, pasang platform-nya, lalu build ulang SEKALI.
          if [ "$RC" -ne 0 ] && grep -qE "compile against version [0-9]+ or later" build.log; then
            NEED=$(grep -oE "compile against version [0-9]+ or later" build.log | grep -oE '[0-9]+' | sort -nr | head -1)
            GF=""
            for f in android/app/build.gradle.kts android/app/build.gradle; do [ -f "$f" ] && { GF="$f"; break; }; done
            if [ -n "$NEED" ] && [ -n "$GF" ]; then
              echo "compileSdk dinaikkan ke $NEED di $GF"
              sed -i -E "s/compileSdk(Version)?([[:space:]]*=[[:space:]]*|[[:space:]]+)[^[:space:]]+/compileSdk\1\2$NEED/" "$GF"
              grep -nE "compileSdk" "$GF" | head -n 3 || true
              SDKM="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
              [ -x "$SDKM" ] && { [ -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/platforms/android-$NEED" ] || yes | "$SDKM" "platforms;android-$NEED" >/dev/null 2>&1 || true; }
              $BUILD_CMD 2>&1 | tee -a build.log
              RC=${PIPESTATUS[0]}
            fi
          fi
          # Package dipakai di kode tapi belum ditulis di pubspec.yaml ("Couldn't resolve the package 'x'"):
          # tambahkan otomatis (versi terbaru yang cocok), lalu build ulang SEKALI. Tidak menyentuh isi lib/.
          if [ "$RC" -ne 0 ] && [ "$MODE" != "url" ] && grep -qE "Couldn't resolve the package '[^']+'" build.log; then
            OWN=$(grep -m1 -E '^name:' pubspec.yaml | sed -E 's/^name:[[:space:]]*//; s/["'"'"'[:space:]]//g' || true)
            MISSING=$(grep -oE "Couldn't resolve the package '[^']+'" build.log | sed -E "s/.*'([^']+)'/\1/" | sort -u | grep -vx "${OWN:-__none__}" || true)
            if [ -n "$MISSING" ]; then
              echo "Package belum ada di pubspec.yaml, ditambahkan otomatis: $(echo $MISSING | tr '\n' ' ')"
              for PKG in $MISSING; do
                flutter pub add "$PKG" 2>&1 | tail -n 3 || echo "::warning::Gagal menambah $PKG"
              done
              flutter pub get 2>&1 | tail -n 3 || true
              $BUILD_CMD 2>&1 | tee -a build.log
              RC=${PIPESTATUS[0]}
            fi
          fi
          # AUTO-FIX aman: error kompilasi Dart dengan pola pasti (const tidak valid, lupa import, import ke file yang salah letak)
          # diperbaiki otomatis lalu build diulang, maksimal 2 putaran. Isi yang hilang dari ZIP TIDAK dikarang.
          if [ "$RC" -ne 0 ] && [ "$MODE" != "url" ]; then
            for ROUND in 1 2; do
              [ "$RC" -ne 0 ] || break
              grep -qE "\.dart:[0-9]+:[0-9]+: Error:" build.log || break
              cp build.log "build_before_autofix_$ROUND.log"
              node /tmp/autofix.js build.log . 2>&1 | tee -a autofix.log
              [ "${PIPESTATUS[0]}" -eq 0 ] || break
              echo "🔧 Auto-fix putaran $ROUND diterapkan, build ulang"
              $BUILD_CMD 2>&1 | tee build.log
              RC=${PIPESTATUS[0]}
            done
          fi
          # Versi Flutter hasil tebakan (.metadata) membuat kode Dart gagal dikompilasi: coba SEKALI dengan versi cadangan (default bot).
          # Dilewati kalau errornya file yang hilang di ZIP (tidak akan tertolong ganti versi).
          if [ "$RC" -ne 0 ] && [ "$MODE" != "url" ] && [ -n "${ALT_FLUTTER:-}" ] \
             && ! grep -q "Error when reading" build.log \
             && grep -qE "\.dart:[0-9]+:[0-9]+: Error:" build.log; then
            echo "↩️ Kode Dart gagal dikompilasi dengan Flutter hasil tebakan, coba sekali dengan Flutter $ALT_FLUTTER"
            cp build.log build_first_try.log
            if install_flutter_version "$ALT_FLUTTER"; then
              sed -i "s|^flutter.sdk=.*|flutter.sdk=$FLUTTER_ROOT|" android/local.properties 2>/dev/null || true
              rm -rf .dart_tool build android/.gradle android/build android/app/build
              if resolve_pub_get; then
                patch_plugin_namespace
                $BUILD_CMD 2>&1 | tee -a build.log
                RC=${PIPESTATUS[0]}
              fi
            fi
          fi
          # Resep build: catat versi Flutter yang BENAR-BENAR dipakai build sukses (termasuk kalau tadi pindah ke versi cadangan)
          if [ "$RC" -eq 0 ] && [ "$MODE" != "url" ]; then
            FV_USED=$(flutter --version --machine 2>/dev/null | sed -n '/^{/,$p' | jq -r '.frameworkVersion // empty' 2>/dev/null || true)
            if [ -n "$FV_USED" ]; then printf '{"flutter":"%s"}\n' "$FV_USED" > "$GITHUB_WORKSPACE/recipe.json"; echo "Resep: Flutter $FV_USED"; fi
          fi
          exit $RC

      - name: Debug - scan all APK
        if: failure()
        run: |
          echo "=== SEMUA APK di project_raw ==="
          find project_raw -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "TIDAK ADA APK"
          echo ""
          echo "=== Tree project_raw/app/build/outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -maxdepth 3 -type d \; 2>/dev/null || true
          echo ""
          echo "=== File di outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -type f \; 2>/dev/null || true

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=""

          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            LOG="${{ steps.detect.outputs.dir }}/build.log"
            if [ -f "$LOG" ]; then
              REL=$(grep -oE 'Built [^ ]+\.apk' "$LOG" | tail -n1 | sed -E 's/^Built //')
              if [ -n "$REL" ]; then
                CAND="${{ steps.detect.outputs.dir }}/$REL"
                if [ -f "$CAND" ]; then
                  APK="$CAND"
                  echo "✅ APK dari build.log (path resmi Flutter): $APK"
                else
                  echo "⚠️ build.log nyebut '$REL' tapi file-nya gak ada di $CAND"
                fi
              else
                echo "⚠️ Gak nemu baris 'Built ...apk' di build.log"
              fi
            fi
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 1 (exclude intermediates/tmp/kotlin/.gradle)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/intermediates/*" \
                  -not -path "*/tmp/*" \
                  -not -path "*/kotlin/*" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 2 (include intermediates)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 3 (flutter-build path)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -path "*/flutter-build/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah semua strategy."
            echo "=== Isi build.log (100 baris terakhir) ==="
            tail -100 "${{ steps.detect.outputs.dir }}/build.log" 2>/dev/null || echo "(build.log tidak ada)"
            echo ""
            echo "=== Full tree project_raw/app/build ==="
            find project_raw -type d -name "build" -exec find {} -maxdepth 4 -type d \; 2>/dev/null | head -50 || true
            echo ""
            echo "=== Semua file .apk (full scan) ==="
            find / -type f -name "*.apk" 2>/dev/null | grep -v "/proc/" | head -20 || true
            exit 1
          fi

          APK_DIR=$(dirname "$APK")
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || echo "0")
          echo "✅ APK ditemukan: $APK"
          echo "📁 Folder: $APK_DIR"
          echo "📦 Size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000 ]; then
            echo "::error::APK terlalu kecil ($APK_SIZE bytes), kemungkinan corrupt."
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload recipe (versi Flutter yang berhasil)
        if: success() && hashFiles('recipe.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: recipe-${{ github.event.inputs.jobId }}
          path: recipe.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.jobId }}
          path: |
            ${{ steps.detect.outputs.dir }}/build.log
            ${{ steps.detect.outputs.dir }}/autofix.log
            ${{ steps.detect.outputs.dir }}/build_before_autofix_*.log
            ${{ steps.detect.outputs.dir }}/android/build.log
          if-no-files-found: ignore
          retention-days: 1
