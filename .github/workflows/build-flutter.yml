name: Build APK Biasa (Flutter / Web2APK) - KHUSUS APK BIASA

run-name: Build ${{ github.event.inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true
      build_type:
        description: 'release / debug'
        required: false
        default: 'release'

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_PLATFORMS: android-arm,android-arm64

    steps:
      - name: Free disk space (background)
        run: |
          # Dulu langkah ini memblokir 1-2 menit. Sekarang rm jalan di background, dan build baru menunggu
          # penanda selesai tepat sebelum Gradle jalan. JANGAN hapus /usr/local/lib/android (SDK dipakai build).
          df -h / | tail -n 1
          rm -f /tmp/free_disk_done
          nohup bash -c '
            sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/share/chromium \
                        /usr/local/share/boost /opt/ghc /usr/local/.ghcup /usr/share/swift \
                        /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/az /usr/lib/google-cloud-sdk \
                        /usr/lib/mono /usr/local/julia* 2>/dev/null
            sudo apt-get clean >/dev/null 2>&1
            docker system prune -af >/dev/null 2>&1
            touch /tmp/free_disk_done
          ' >/dev/null 2>&1 &
          disown || true

      - name: Parse payload
        run: |
          set -euo pipefail
          echo '${{ github.event.inputs.payload }}' > payload.json
          cat payload.json

          # [bot-workflow] rev=2026-11-04.4 (build cepat: Flutter 1 keputusan tanpa uji satu-satu, build ZIP pakai jalur cepat 2 ABI + Gradle paralel; sebelumnya 2026-11-04.3: KHUSUS APK BIASA: cabang Gradle native/Genetic dihapus total dari workflow ini, Genetic hanya di build-android.yml; alur dispatch/payload/unduh ZIP/artifact apk-jobId mengikuti AMBIL_ALURGH; sebelumnya 2026-11-04.2 jalur dipisah via payload.projectType; 2026-11-04.1 alur Flutter mode ZIP disamakan dengan worker VPS; 2026-11-01.2 samain alur AMBIL_ALURGH: payload url+tag, cek ZIP kosong, run-name=jobId; 2026-10-27.2 tambah Free disk space)
          # Tipe build: payload.buildType dulu (dikirim bot), cadangan input build_type, default release
          BUILD_TYPE=$(jq -r '.buildType // empty' payload.json)
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE=release
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

          # Workflow ini KHUSUS APK BIASA (Flutter). Jalur GENETIC (Android native) punya workflow sendiri
          # (build-android.yml) dan tidak pernah lewat sini.
          REQ_TYPE=$(jq -r '.projectType // empty' payload.json)
          if [ "$REQ_TYPE" = "android" ]; then
            echo "::error::Workflow ini KHUSUS APK BIASA (Flutter). Mode yang dipilih KHUSUS GENETIC (Android Java/Kotlin) harus memakai workflow build-android.yml."
            exit 1
          fi
          echo "Mode: KHUSUS APK BIASA (Flutter)"

          MODE=$(jq -r '.mode // empty' payload.json)
          if [ -z "$MODE" ]; then
            if jq -e '.appName' payload.json >/dev/null 2>&1; then MODE="url"; else MODE="zip"; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

          if [ "$MODE" = "url" ]; then
            WEB_URL=$(jq -r '.url // empty' payload.json)
            APP_NAME=$(jq -r '.appName // "WebApp"' payload.json)
            ICON_URL=$(jq -r '.iconUrl // empty' payload.json)
            if [ -z "$WEB_URL" ]; then
              echo "::error::mode=url tapi gak ada 'url' website di payload"
              exit 1
            fi
            echo "WEB_URL=$WEB_URL" >> "$GITHUB_ENV"
            echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
            echo "ICON_URL=$ICON_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: Web2APK -> $WEB_URL ($APP_NAME)"
          else
            ZIP_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
            if [ -z "$ZIP_URL" ]; then
              echo "::error::Tidak ada zipAssetUrl / url di payload"
              exit 1
            fi
            echo "ZIP_URL=$ZIP_URL" >> "$GITHUB_ENV"
            echo "✅ Mode: ZIP project -> $ZIP_URL"
          fi

      - name: Download & extract ZIP
        if: env.MODE == 'zip'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u; set +e
          rm -rf project_raw project.zip
          mkdir -p project_raw

          TAG=$(jq -r '.tag // empty' payload.json)
          PUBLIC_URL=$(jq -r '.url // empty' payload.json)

          OK=0
          # 1) Link publik dari payload.url (jalur sama seperti AMBIL_ALURGH)
          if [ -n "$PUBLIC_URL" ]; then
            echo "Unduh via link publik..."
            if curl -fL --retry 3 --retry-delay 5 -o project.zip "$PUBLIC_URL" && [ -s project.zip ]; then OK=1; fi
          fi
          # 2) Cadangan: cari asset lewat tag release + token (repo private)
          if [ "$OK" != "1" ] && [ -n "$TAG" ]; then
            echo "Cari asset lewat tag $TAG ..."
            ASSET_ID=$(curl -fsSL --retry 3 --retry-delay 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}" \
              | jq -r '.assets[0].id // empty' || true)
            if [ -n "$ASSET_ID" ]; then
              if curl -fL --retry 3 --retry-delay 5 \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/octet-stream" \
                   -o project.zip "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" \
                 && [ -s project.zip ]; then OK=1; fi
            fi
          fi
          if [ "$OK" != "1" ]; then
            echo "::error::Gagal mengunduh ZIP project (url=$PUBLIC_URL, tag=$TAG)"
            exit 22
          fi

          ls -lh project.zip
          # Ekstrak: unzip dulu, kalau gagal / hasil kosong coba 7z. Jangan lanjut kalau kosong.
          unzip -o -q project.zip -d project_raw || true
          if [ -z "$(find project_raw -type f | head -n 1)" ]; then
            echo "unzip tidak menghasilkan file, coba 7z..."
            (command -v 7z >/dev/null 2>&1 || sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1) || true
            7z x -y -oproject_raw project.zip >/dev/null 2>&1 || true
          fi
          if [ -z "$(find project_raw -type f | head -n 1)" ]; then
            echo "::error::ZIP kosong / gagal diekstrak (ukuran: $(stat -c%s project.zip) byte)"
            unzip -l project.zip 2>&1 | head -20 || true
            exit 1
          fi

          # ZIP di dalam ZIP: sama seperti worker VPS, SEMUA zip di dalam dibuka dulu (maksimal 3 putaran)
          # sebelum project dideteksi, supaya project Flutter yang ada di ZIP dalam terbaca.
          for ROUND in 1 2 3; do
            NESTED=$(find project_raw -type f -iname '*.zip')
            if [ -z "$NESTED" ]; then break; fi
            FOUND=0
            echo "Buka ZIP di dalam ZIP (putaran $ROUND dari 3) ..."
            while IFS= read -r Z; do
              [ -n "$Z" ] || continue
              D="${Z%.*}"
              mkdir -p "$D"
              if unzip -o -q "$Z" -d "$D" || 7z x -y -o"$D" "$Z" >/dev/null 2>&1; then rm -f "$Z"; FOUND=1; else rm -rf "$D"; fi
            done <<< "$NESTED"
            [ "$FOUND" -eq 1 ] || break
          done

          echo "=== Struktur root project_raw ==="
          find project_raw -maxdepth 3 -type d | head -50
          echo ""
          echo "=== File kunci ==="
          find project_raw -maxdepth 6 -type f -name "pubspec.yaml" \
            -not -path "*/build/*" | head -30

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: env.MODE == 'url'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: false

      - name: Detect / Generate project
        id: detect
        run: |
          set -euo pipefail

          if [ "$MODE" = "url" ]; then
            SAFE_NAME=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_]+/_/g' | sed -E 's/^[0-9]+/a&/')
            [ -z "$SAFE_NAME" ] && SAFE_NAME="webapp"
            export APP_NAME WEB_URL
            DART_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; s=s.replace(chr(92),chr(92)*2).replace(chr(39),chr(92)+chr(39)); sys.stdout.write(s)")
            XML_APP_NAME=$(python3 -c "import os,sys; s=os.environ['APP_NAME']; sys.stdout.write(''.join(c for c in s if c not in '&<>'+chr(34)))")
            WEB_URL_SAFE=$(python3 -c "import os,sys; sys.stdout.write(os.environ['WEB_URL'].replace(chr(39),'%27'))")

            mkdir -p project_raw
            cd project_raw
            echo "🛠️  flutter create $SAFE_NAME ..."
            flutter create --org com.ziperr --project-name "$SAFE_NAME" --platforms=android --no-pub "$SAFE_NAME" >/dev/null
            cd "$SAFE_NAME"

            echo "📦 Nambah webview_flutter ..."
            flutter pub add webview_flutter

            HAS_ICON=false
            if [ -n "$ICON_URL" ]; then
              mkdir -p assets
              if curl -fsSL --max-time 20 "$ICON_URL" -o assets/icon.png && [ -s assets/icon.png ]; then
                HAS_ICON=true
                echo "🎨 Icon custom terdeteksi, nambah flutter_launcher_icons ..."
                flutter pub add dev:flutter_launcher_icons
                printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n' > flutter_launcher_icons.yaml
              else
                echo "::warning::Gagal download icon dari $ICON_URL, pakai icon default Flutter."
              fi
            fi

            if [ "$HAS_ICON" = "true" ]; then
              echo "🎨 Generate launcher icon ..."
              dart run flutter_launcher_icons || echo "::warning::flutter_launcher_icons gagal, lanjut pakai icon default."
            fi

            export DART_APP_NAME WEB_URL_SAFE
            echo '' | base64 -d > lib/main.dart
            python3 -c "import os; p='lib/main.dart'; c=open(p).read(); c=c.replace('__DART_APP_NAME__', os.environ['DART_APP_NAME']).replace('__WEB_URL_SAFE__', os.environ['WEB_URL_SAFE']); open(p,'w').write(c)"

            sed -i "s/android:label=\"[^\"]*\"/android:label=\"${XML_APP_NAME}\"/" android/app/src/main/AndroidManifest.xml

            python3 -c "p='android/app/src/main/AndroidManifest.xml'; c=open(p).read(); c=c if 'android.permission.INTERNET' in c else c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application', 1); c=c if 'usesCleartextTraffic' in c else c.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1); open(p,'w').write(c)"

            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=project_raw/$SAFE_NAME" >> "$GITHUB_OUTPUT"
            echo "✅ Web2APK project di-generate -> project_raw/$SAFE_NAME"

          else
            # Pilih pubspec.yaml terbaik, bukan sekadar yang pertama ketemu: project ZIP sering
            # berisi pubspec lain (package/plugin/example) yang tidak punya lib/main.dart.
            # Skor: punya lib/main.dart (+400), punya folder android (+200), sdk flutter (+100),
            # makin dangkal makin baik.
            PUBSPEC=""
            BEST=-100000
            while IFS= read -r f; do
              d=$(dirname "$f")
              score=0
              [ -f "$d/lib/main.dart" ] && score=$((score+400))
              [ -d "$d/android" ] && score=$((score+200))
              grep -q 'sdk: flutter' "$f" 2>/dev/null && score=$((score+100))
              depth=$(printf '%s' "$d" | tr -cd '/' | wc -c)
              score=$((score-depth))
              echo "kandidat pubspec: $f (skor $score)"
              if [ "$score" -gt "$BEST" ]; then BEST=$score; PUBSPEC="$f"; fi
            done < <(find project_raw -type f -name pubspec.yaml \
                      -not -path "*/build/*" -not -path "*/.dart_tool/*" \
                      -not -path "*/.symlinks/*" -not -path "*/ephemeral/*")

            echo "pubspec : ${PUBSPEC:-<none>}"

            if [ -z "$PUBSPEC" ]; then
              echo "::error::Mode KHUSUS APK BIASA (Flutter), tetapi ZIP tidak punya pubspec.yaml. Kalau ini project Android Java/Kotlin, pilih KHUSUS GENETIC lalu build ulang."
              echo "=== Isi ZIP (kedalaman 3) ==="
              find project_raw -maxdepth 3 | head -50
              exit 1
            fi

            DIR=$(dirname "$PUBSPEC")
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$DIR"     >> "$GITHUB_OUTPUT"
            echo "✅ Flutter project → $DIR"
          fi

      - name: Pilih versi Flutter (1 keputusan, tanpa uji satu-satu)
        id: fv
        if: env.MODE != 'url'
        env:
          PROJ_DIR: ${{ steps.detect.outputs.dir }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const FALLBACK = '3.38.0';
          const FALLBACK_DART = '3.10.0'; // Dart bawaan Flutter 3.38.0, dipakai supaya kasus umum tidak perlu unduh katalog rilis
          const out = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v + '\n');
          const dir = process.env.PROJ_DIR || '.';
          let text = '';
          try { text = fs.readFileSync(dir + '/pubspec.yaml', 'utf8'); } catch (_) { out(FALLBACK); process.exit(0); }

          // Sama seperti VPS (projectPrep.js selectCompatibleFlutter): baca blok environment pubspec.yaml
          function yamlConstraint(key) {
            const m = text.match(/(?:^|\n)environment\s*:\s*\n([\s\S]*?)(?=\n[^ \t]|$)/i);
            if (!m) return '';
            for (const line of m[1].split(/\r?\n/)) {
              const x = line.match(/^\s*([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*?)\s*$/);
              if (x && x[1].toLowerCase() === key.toLowerCase()) return x[2].replace(/^['"]|['"]$/g, '').trim();
            }
            return '';
          }
          const dartRange = yamlConstraint('sdk');
          const flutterRange = yamlConstraint('flutter');
          function ver(s) { const m = String(s || '').match(/(?:v)?(\d+)\.(\d+)(?:\.(\d+))?/); return m ? [Number(m[1]), Number(m[2]), Number(m[3] || 0)] : null; }
          function cmp(a, b) { for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] - b[i]; } return 0; }
          function bumpCaret(lo) { if (lo[0] > 0) return [lo[0] + 1, 0, 0]; if (lo[1] > 0) return [0, lo[1] + 1, 0]; return [0, 0, lo[2] + 1]; }
          function satisfies(version, expr) {
            if (!expr || expr === 'any') return true;
            const x = ver(version); if (!x) return false;
            return String(expr).split(/\s*\|\|\s*/).some((part) => part.trim().split(/\s+/).filter(Boolean).every((tok) => {
              if (tok === 'any') return true;
              if (tok.startsWith('^')) { const lo = ver(tok.slice(1)); if (!lo) return false; return cmp(x, lo) >= 0 && cmp(x, bumpCaret(lo)) < 0; }
              if (tok.startsWith('~')) { const lo = ver(tok.slice(1)); if (!lo) return false; return cmp(x, lo) >= 0 && cmp(x, [lo[0], lo[1] + 1, 0]) < 0; }
              const op = (tok.match(/^(>=|<=|>|<|=)/) || [])[1] || '=';
              const m = tok.replace(/^(>=|<=|>|<|=)/, '').match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?/);
              if (!m) return true;
              const c = cmp(x, [Number(m[1]), Number(m[2] || 0), Number(m[3] || 0)]);
              if (op === '>=') return c >= 0; if (op === '>') return c > 0; if (op === '<=') return c <= 0; if (op === '<') return c < 0;
              return c === 0;
            }));
          }
          function get(url) {
            return new Promise((resolve, reject) => https.get(url, (res) => {
              let d = ''; res.on('data', (c) => d += c);
              res.on('end', () => res.statusCode >= 200 && res.statusCode < 300 ? resolve(d) : reject(new Error('HTTP ' + res.statusCode)));
            }).on('error', reject));
          }
          (async () => {
            console.log('pubspec environment: sdk="' + dartRange + '" flutter="' + flutterRange + '"');
            // Jalur cepat: versi default cocok -> selesai, tanpa fetch katalog dan tanpa menimbang versi lain.
            if (satisfies(FALLBACK_DART, dartRange) && satisfies(FALLBACK, flutterRange)) { console.log('Flutter default ' + FALLBACK + ' cocok (jalur cepat)'); out(FALLBACK); return; }
            const raw = process.env.FLUTTER_RELEASES_FILE
              ? fs.readFileSync(process.env.FLUTTER_RELEASES_FILE, 'utf8')
              : await get('https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json');
            // Lantai versi: jangan pernah di bawah FALLBACK (Dart 3.10). Package terbaru (mis. path_provider >=2.1.6) butuh Dart ^3.10.0,
            // jadi Flutter lama yang cocok dengan batas atas pubspec justru membuat "version solving failed".
            const stable = (JSON.parse(raw).releases || []).filter((r) => r.channel === 'stable' && r.archive && r.version && cmp(ver(r.version), ver(FALLBACK)) >= 0);
            stable.sort((a, b) => String(b.release_date || '').localeCompare(String(a.release_date || '')));
            const fits = (r) => (!dartRange || !r.dart_sdk_version || satisfies(r.dart_sdk_version, dartRange)) && (!flutterRange || satisfies(r.version, flutterRange));
            // Urutan sama dengan VPS: versi default dipakai kalau cocok, kalau tidak yang stable terbaru yang cocok.
            const def = stable.find((r) => r.version === FALLBACK);
            if (def && fits(def)) { console.log('Flutter default ' + FALLBACK + ' cocok'); out(FALLBACK); return; }
            const pick = stable.find(fits);
            if (pick) { console.log('Flutter dipilih: ' + pick.version + ' (dart ' + pick.dart_sdk_version + ')'); out(pick.version); return; }
            console.log('::warning::Tidak ada Flutter stable >= ' + FALLBACK + ' yang cocok dengan batas pubspec (sdk="' + dartRange + '"), pakai ' + FALLBACK + ' (batas atas SDK diabaikan)');
            out(FALLBACK);
          })().catch((e) => { console.log('::warning::Gagal memilih versi Flutter (' + e.message + '), pakai ' + FALLBACK); out(FALLBACK); });
          NODE

      - name: Setup Flutter (versi sesuai project)
        if: env.MODE != 'url'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: stable
          cache: false

      - name: Sanitize Android PNG resources
        run: |
          set +e
          DIR="${{ steps.detect.outputs.dir }}"
          if command -v magick >/dev/null 2>&1; then IM="magick"; elif command -v convert >/dev/null 2>&1; then IM="convert"; else IM=""; fi
          if [ -z "$IM" ]; then echo "ImageMagick tidak ada, lewati sanitasi PNG"; exit 0; fi
          FIXED=0; BAD=0
          while IFS= read -r f; do
            case "$f" in *.9.png) continue;; esac
            # Re-encode ke PNG 8-bit RGBA non-interlaced (isi file dibaca dari konten, bukan ekstensi)
            if $IM "$f" -strip -depth 8 -interlace none -define png:color-type=6 "PNG32:$f.fixed" 2>/dev/null && [ -s "$f.fixed" ]; then
              mv -f "$f.fixed" "$f"; FIXED=$((FIXED+1))
            else
              rm -f "$f.fixed"; BAD=$((BAD+1))
              echo "⚠️ PNG tidak bisa dibaca, diganti ikon polos: $f"
              SZ=96; case "$f" in *mipmap-mdpi*) SZ=48;; *mipmap-hdpi*) SZ=72;; *mipmap-xhdpi*) SZ=96;; *mipmap-xxhdpi*) SZ=144;; *mipmap-xxxhdpi*) SZ=192;; esac
              case "$(basename "$f")" in
                ic_launcher*) $IM -size ${SZ}x${SZ} xc:'#2196F3' "PNG32:$f" ;;
                *) rm -f "$f" ;;
              esac
            fi
          done < <(find "$DIR" -type f -iname '*.png' -path '*/src/main/res/*' \( -path '*/mipmap*' -o -path '*/drawable*' \) -not -path '*/build/*' 2>/dev/null)
          echo "✅ Sanitasi PNG resource: $FIXED diperbaiki, $BAD tidak terbaca"
          exit 0

      - name: Clean stale artifacts from ZIP (build dari nol)
        run: |
          set +e
          DIR="${{ steps.detect.outputs.dir }}"
          echo "Bersihkan sisa build bawaan ZIP di: $DIR"
          # Hanya folder hasil build di lokasi standar (jangan hapus folder source bernama "build")
          for d in "$DIR/build" "$DIR/.dart_tool" "$DIR/.gradle" "$DIR/android/.gradle" \
                   "$DIR/android/build" "$DIR/android/app/build" "$DIR/.gradle" "$DIR/ios/Pods"; do
            [ -d "$d" ] && { echo "hapus $d"; rm -rf "$d"; }
          done
          rm -f "$DIR/.flutter-plugins" "$DIR/.flutter-plugins-dependencies" "$DIR/.packages" "$DIR/pubspec.lock.bak" 2>/dev/null
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" 2>/dev/null
          echo "✅ Bersih. Build jalan tanpa cache."
          exit 0

      - name: Tune gradle.properties
        run: |
          set -euo pipefail
          GP="${{ steps.detect.outputs.dir }}/android/gradle.properties"
          mkdir -p "$(dirname "$GP")"
          touch "$GP"
          sed -i '/kotlin.jvm.target.validation.mode/d' "$GP" || true
          sed -i '/# >>> DEY BUILD WORKER >>>/,/# <<< DEY BUILD WORKER <<</d;/# >>> RIZQY BUILD WORKER >>>/,/# <<< RIZQY BUILD WORKER <<</d' "$GP" || true
          sed -i '/org.gradle.jvmargs/d;/org.gradle.parallel/d;/org.gradle.caching/d;/org.gradle.daemon/d;/org.gradle.configureondemand/d;/org.gradle.workers.max/d' "$GP" || true
          RAM_MB=$(free -m | awk '/^Mem:/{print $2}'); RAM_MB=${RAM_MB:-7000}
          CPUS=$(nproc 2>/dev/null || echo 2)
          if   [ "$RAM_MB" -lt 6144 ];  then XMX=2048; elif [ "$RAM_MB" -lt 10240 ]; then XMX=3072; else XMX=4096; fi
          WORKERS=$CPUS; [ "$WORKERS" -gt 4 ] && WORKERS=4
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx${XMX}m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=false"
            echo "org.gradle.daemon=false"
            echo "org.gradle.workers.max=$WORKERS"
            echo "kotlin.jvm.target.validation.mode=warning"
          } >> "$GP"
          # useAndroidX hanya ditambah kalau project tidak punya; Jetifier TIDAK dipaksa (memperlambat, project yang butuh sudah menyetel sendiri)
          grep -q '^android.useAndroidX' "$GP" || echo "android.useAndroidX=true" >> "$GP"
          echo "RAM=${RAM_MB}MB CPU=${CPUS} Xmx=${XMX}m workers=${WORKERS}"
          echo "GRADLE_XMX=$XMX" >> "$GITHUB_ENV"

      - name: Speed up Gradle (skip lintVital)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          echo '' | base64 -d > "$HOME/.gradle/init.d/fastbuild.gradle"
          echo "✅ init script terpasang:"
          cat "$HOME/.gradle/init.d/fastbuild.gradle"

      - name: Use preinstalled NDK (skip download)
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_VER=$(ls -1 "$SDK/ndk" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_VER" ]; then
            echo "ℹ️ Gak ada NDK preinstalled di $SDK/ndk -- biarin Gradle download."
            exit 0
          fi
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ] && grep -qE 'ndkVersion[[:space:]]*=?[[:space:]]*flutter\.ndkVersion' "$f"; then
              sed -i -E 's/ndkVersion[[:space:]]*=?[[:space:]]*flutter\.ndkVersion/ndkVersion = "'"$NDK_VER"'"/' "$f"
              echo "✅ $f -> ndkVersion = $NDK_VER (preinstalled, gak perlu download)"
              exit 0
            fi
          done
          echo "ℹ️ Baris 'ndkVersion = flutter.ndkVersion' gak ketemu -- dilewati."

      - name: Build Flutter APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          export BOT=true
          BT="$BUILD_TYPE"

          # 1) Java 17, kecuali Gradle project < 7.6 memakai Java 11
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          [ -f "$WRAPPER_PROPS" ] || WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"
          JAVA_PICK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          if [ -f "$WRAPPER_PROPS" ]; then
            GV=$(grep 'distributionUrl' "$WRAPPER_PROPS" | grep -oE 'gradle-[0-9]+\.[0-9]+' | head -1 | sed 's/gradle-//' || true)
            GM=$(echo "$GV" | cut -d. -f1); GN=$(echo "$GV" | cut -d. -f2)
            if [ -n "${JAVA_HOME_11_X64:-}" ] && [ -n "$GM" ] && { [ "$GM" -lt 7 ] || { [ "$GM" -eq 7 ] && [ "${GN:-0}" -lt 6 ]; }; }; then JAVA_PICK="$JAVA_HOME_11_X64"; fi
          fi
          export JAVA_HOME="$JAVA_PICK"; export PATH="$JAVA_HOME/bin:$PATH"
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter config --jdk-dir "$JAVA_HOME" >/dev/null 2>&1 || true
          echo "Java: $JAVA_HOME (gradle wrapper: ${GV:-?})"

          # 2) Android SDK: pasang HANYA compileSdk/build-tools/NDK eksplisit yang diminta project dan belum ada
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "$SDK" ]; then
            export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
            export PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/platform-tools"
            flutter config --android-sdk "$SDK" >/dev/null 2>&1 || true
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ] && [ "$MODE" = "zip" ]; then
              CS=$(grep -RhoE 'compileSdk(Version)?[^0-9]*[0-9]+' android 2>/dev/null | grep -oE '[0-9]+$' | sort -nr | head -1 || true)
              BTV=$(grep -RhoE 'buildToolsVersion[^0-9]*[0-9.]+' android 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              NDKV=$(grep -RhoE 'ndkVersion[^0-9]*[0-9.]+' android 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
              [ -n "$CS" ]   && { [ -d "$SDK/platforms/android-$CS" ] || yes | "$SDKM" "platforms;android-$CS" >/dev/null 2>&1 || true; }
              [ -n "$BTV" ]  && { [ -d "$SDK/build-tools/$BTV" ]      || yes | "$SDKM" "build-tools;$BTV" >/dev/null 2>&1 || true; }
              [ -n "$NDKV" ] && { [ -d "$SDK/ndk/$NDKV" ]             || yes | "$SDKM" "ndk;$NDKV" >/dev/null 2>&1 || true; }
            fi
          fi

          # 3) pub get (tanpa flutter clean: runner baru + langkah "Clean stale artifacts" sudah bersih)
          if [ "$MODE" != "url" ]; then
            flutter pub get
            if [ -f pubspec.yaml ] && grep -q "flutter_launcher_icons:" pubspec.yaml; then
              flutter pub run flutter_launcher_icons || echo "::warning::Pembuatan ikon launcher gagal, build lanjut"
            fi
            if [ -d "android/app/src/main/res" ]; then
              find android/app/src/main/res/mipmap-* \( -name "ic_launcher*.png" -o -name "ic_launcher*.jpg" \) -size 0 -delete 2>/dev/null || true
              for mipmap in android/app/src/main/res/mipmap-*; do
                [ -d "$mipmap" ] || continue
                for icon in "$mipmap"/ic_launcher*.jpg; do
                  [ -f "$icon" ] || continue
                  b=$(basename "$icon" .jpg)
                  [ -f "$mipmap/$b.png" ] && rm -f "$icon"
                done
              done
            fi
          fi

          # 4) local.properties
          FLUTTER_SDK_PATH=$(dirname "$(dirname "$(command -v flutter)")")
          mkdir -p android
          if [ -n "$SDK" ]; then echo "sdk.dir=$SDK" > android/local.properties; else : > android/local.properties; fi
          echo "flutter.sdk=$FLUTTER_SDK_PATH" >> android/local.properties

          # 5) Entry point: lib/main.dart, kalau tidak ada cari file lain yang punya main()
          TARGET_ARGS=""
          if [ ! -f lib/main.dart ]; then
            ALT=$(ls lib/main_*.dart lib/*/main.dart 2>/dev/null | head -n 1 || true)
            if [ -z "$ALT" ] && [ -d lib ]; then
              ALT=$(grep -rlE '^[[:space:]]*(void|Future<void>)[[:space:]]+main[[:space:]]*\(' lib --include='*.dart' 2>/dev/null | head -n 1 || true)
            fi
            if [ -n "$ALT" ]; then
              echo "lib/main.dart tidak ada, memakai entry point: $ALT"
              TARGET_ARGS="-t $ALT"
            else
              echo "::error::Target file \"lib/main.dart\" not found. Tidak ada file Dart dengan fungsi main() di $(pwd)."
              ls -la; ls -la lib 2>/dev/null || echo "(folder lib tidak ada)"
              exit 1
            fi
          fi

          # 6) Tunggu pembersihan disk background (biasanya sudah selesai jauh sebelum sampai sini)
          for i in $(seq 1 60); do [ -f /tmp/free_disk_done ] && break; sleep 3; done
          df -h / | tail -n 1

          # 7) Build jalur cepat: 2 ABI saja (arm, arm64), tanpa shrink/tree-shake, --no-pub (pub get sudah dijalankan)
          set +e
          BUILD_CMD="flutter build apk --$BT $TARGET_ARGS --target-platform=$TARGET_PLATFORMS --no-tree-shake-icons --no-shrink --no-pub"
          $BUILD_CMD 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          # Satu kali ulang HANYA kalau daemon mati / kehabisan memori, dengan heap dinaikkan (bukan ulang dengan setelan sama)
          if [ "$RC" -ne 0 ] && grep -qiE 'daemon has disappeared|daemon disappeared|Gradle build daemon disappeared|OutOfMemoryError|Java heap space|GC overhead' build.log; then
            echo "Gradle kehabisan memori / daemon mati, ulang sekali dengan heap lebih besar"
            (cd android && ./gradlew --stop >/dev/null 2>&1 || true)
            GP="android/gradle.properties"
            sed -i -E "s/^org.gradle.jvmargs=-Xmx[0-9]+m/org.gradle.jvmargs=-Xmx$(( ${GRADLE_XMX:-3072} + 1024 ))m/" "$GP" || true
            $BUILD_CMD 2>&1 | tee -a build.log
            RC=${PIPESTATUS[0]}
          fi
          exit $RC

      - name: Debug - scan all APK
        if: failure()
        run: |
          echo "=== SEMUA APK di project_raw ==="
          find project_raw -type f -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "TIDAK ADA APK"
          echo ""
          echo "=== Tree project_raw/app/build/outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -maxdepth 3 -type d \; 2>/dev/null || true
          echo ""
          echo "=== File di outputs ==="
          find project_raw -type d -name "outputs" -exec find {} -type f \; 2>/dev/null || true

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK=""

          if [ "${{ steps.detect.outputs.type }}" = "flutter" ]; then
            LOG="${{ steps.detect.outputs.dir }}/build.log"
            if [ -f "$LOG" ]; then
              REL=$(grep -oE 'Built [^ ]+\.apk' "$LOG" | tail -n1 | sed -E 's/^Built //')
              if [ -n "$REL" ]; then
                CAND="${{ steps.detect.outputs.dir }}/$REL"
                if [ -f "$CAND" ]; then
                  APK="$CAND"
                  echo "✅ APK dari build.log (path resmi Flutter): $APK"
                else
                  echo "⚠️ build.log nyebut '$REL' tapi file-nya gak ada di $CAND"
                fi
              else
                echo "⚠️ Gak nemu baris 'Built ...apk' di build.log"
              fi
            fi
          fi

          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 1 (exclude intermediates/tmp/kotlin/.gradle)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/intermediates/*" \
                  -not -path "*/tmp/*" \
                  -not -path "*/kotlin/*" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 2 (include intermediates)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -not -path "*/.gradle/*" \
                  2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "↩️ Fallback strategy 3 (flutter-build path)"
            APK=$(find project_raw -type f -name "*.apk" \
                  -path "*/flutter-build/*" \
                  2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah semua strategy."
            echo "=== Isi build.log (100 baris terakhir) ==="
            tail -100 "${{ steps.detect.outputs.dir }}/build.log" 2>/dev/null || echo "(build.log tidak ada)"
            echo ""
            echo "=== Full tree project_raw/app/build ==="
            find project_raw -type d -name "build" -exec find {} -maxdepth 4 -type d \; 2>/dev/null | head -50 || true
            echo ""
            echo "=== Semua file .apk (full scan) ==="
            find / -type f -name "*.apk" 2>/dev/null | grep -v "/proc/" | head -20 || true
            exit 1
          fi

          APK_DIR=$(dirname "$APK")
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || echo "0")
          echo "✅ APK ditemukan: $APK"
          echo "📁 Folder: $APK_DIR"
          echo "📦 Size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000 ]; then
            echo "::error::APK terlalu kecil ($APK_SIZE bytes), kemungkinan corrupt."
            exit 1
          fi

          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.jobId }}
          path: |
            ${{ steps.detect.outputs.dir }}/build.log
            ${{ steps.detect.outputs.dir }}/android/build.log
          if-no-files-found: ignore
          retention-days: 1
